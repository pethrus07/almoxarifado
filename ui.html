async function abrirRelatorio(qual) {
  const alvo = limpar($("#conteudo"));
  const def = RELATORIOS.find((r) => r.id === qual);
  $("#titulo-tela").textContent = def?.rotulo || "Relatório";
  alvo.appendChild(esqueleto());

  const d = await api("/relatorios/" + qual);
  limpar(alvo);
  alvo.appendChild(h("button", { class: "btn plano", style: "margin-bottom:10px",
    onclick: () => irPara("relatorios") }, icone("esquerda", 16), "Relatórios"));

  const veDinheiro = estado.eu.ve_dinheiro;

  if (qual === "reposicao") {
    if (!d.linhas.length) {
      alvo.appendChild(vazio("certo", "Nada para comprar", "Nenhum item abaixo do mínimo."));
      return;
    }
    if (veDinheiro) {
      alvo.appendChild(h("div", { class: "indicador destaque", style: "margin-bottom:14px" },
        h("div", { class: "indicador-rotulo", texto: "Estimativa do pedido" }),
        h("div", { class: "indicador-valor", texto: dinheiro(d.total) }),
        h("div", { class: "indicador-nota", texto: "pelo último custo de compra" })));
    }

    const porFornecedor = new Map();
    for (const l of d.linhas) {
      if (!porFornecedor.has(l.fornecedor)) porFornecedor.set(l.fornecedor, []);
      porFornecedor.get(l.fornecedor).push(l);
    }
    for (const [fornecedor, linhas] of porFornecedor) {
      alvo.append(
        h("div", { class: "busca-grupo-titulo", style: "margin-top:14px", texto: fornecedor }),
        h("div", { class: "lista" }, linhas.map((l) =>
          h("button", { class: "linha critico", onclick: () => abrirItem(l.id) },
            h("div", { class: "linha-corpo" },
              h("div", { class: "linha-nome uma-linha", texto: l.nome }),
              h("div", { class: "linha-meta" },
                h("span", { texto: `tem ${num(l.saldo)} · mínimo ${num(l.estoque_minimo)}` }),
                l.dias_cobertura !== null ? h("span", { class: "sep", texto: "·" }) : null,
                l.dias_cobertura !== null
                  ? h("span", { texto: `dura ${num(l.dias_cobertura)} dias` }) : null)),
            h("div", { class: "linha-fim" },
              h("div", { class: "linha-saldo atencao" },
                num(l.comprar_embalagem ?? l.comprar),
                h("small", { texto: l.comprar_embalagem ? l.unidade_compra : l.unidade })),
              veDinheiro && l.valor
                ? h("div", { class: "mini sutil", texto: dinheiro(l.valor) }) : null)))));
    }
    return;
  }

  if (qual === "consumo") {
    if (!d.linhas.length) {
      alvo.appendChild(vazio("grafico", "Sem consumo no período", "Nenhuma saída registrada."));
      return;
    }
    const maior = Math.max(...d.linhas.map((l) => veDinheiro ? l.valor_total : l.quantidade), 1);
    alvo.appendChild(h("p", { class: "peq sutil", style: "margin-bottom:10px",
      texto: `De ${d.periodo.de} até ${d.periodo.ate.slice(0, 10)}` }));
    alvo.appendChild(h("div", { class: "cartao rolagem-x" },
      h("table", { class: "dados" },
        h("thead", {}, h("tr", {},
          h("th", { texto: "Frente" }),
          h("th", {}),
          // "Itens" é a coluna menos útil das quatro: sai no celular para
          // as outras três caberem sem rolagem lateral.
          h("th", { class: "num so-computador", texto: "Itens" }),
          veDinheiro ? h("th", { class: "num", texto: "Valor" }) : null)),
        h("tbody", {}, d.linhas.map((l) => {
          const v = veDinheiro ? l.valor_total : l.quantidade;
          return h("tr", {},

              l.obra ? h("div", { class: "mini sutil", texto: l.obra }) : null),
            h("td", { style: "width:38%" },
              h("div", { class: "barra-dado" },
                h("i", { style: `width:${(v / maior) * 100}%` }))),
            h("td", { class: "num so-computador", texto: num(l.itens) }),
            veDinheiro ? h("td", { class: "num forte", texto: dinheiro(l.valor_total) }) : null);
        })))));
    return;
  }

  if (qual === "abc") {
    if (!d.linhas.length) {
      alvo.appendChild(vazio("caixas", "Sem dados de custo",
        "A curva ABC precisa do custo das entradas para funcionar."));
      return;
    }
    const classes = { A: [], B: [], C: [] };
    for (const l of d.linhas) classes[l.classe].push(l);
    alvo.appendChild(h("div", { class: "grade c3", style: "margin-bottom:14px" },
      ["A", "B", "C"].map((c) => h("div", { class: "indicador " + (c === "A" ? "destaque" : "") },
        h("div", { class: "indicador-rotulo", texto: `Classe ${c}` }),
        h("div", { class: "indicador-valor", texto: num(classes[c].length) }),
        h("div", { class: "indicador-nota",
          texto: c === "A" ? "80% do valor" : c === "B" ? "os 15% seguintes" : "os últimos 5%" })))));
    /* Lista, não tabela. Cinco colunas num aparelho de 390px viram uma
       tabela que só rola de lado — e ninguém rola de lado para ler
       relatório. A linha carrega a mesma informação e é tocável. */
    const maiorValor = d.linhas[0]?.valor_total || 1;
    alvo.appendChild(h("div", { class: "lista" }, d.linhas.slice(0, 60).map((l) =>
      h("button", { class: "linha", onclick: () => abrirItem(l.id) },
        h("div", { class: "linha-foto",
          style: l.classe === "A"
            ? "background:rgb(var(--acento-rgb)/.18);color:var(--acento)" : "" },
          h("span", { class: "forte", texto: l.classe })),
        h("div", { class: "linha-corpo" },
          h("div", { class: "linha-nome uma-linha", texto: l.nome }),
          h("div", { class: "linha-meta" },
            h("span", { class: "mono", texto: l.codigo }),
            h("span", { class: "sep", texto: "·" }),
            h("span", { texto: `${num(l.quantidade)} ${l.unidade}` }),
            h("span", { class: "sep so-computador", texto: "·" }),
            h("span", { class: "so-computador",
                        texto: `${num(l.acumulado)}% acumulado` })),
          h("div", { class: "medidor", style: "margin-top:6px" },
            h("i", { style: `width:${Math.max((l.valor_total / maiorValor) * 100, 2)}%;` +
                            "background:var(--acento)" }))),
        h("div", { class: "linha-fim" },
          h("div", { class: "linha-saldo", texto: dinheiro(l.valor_total) }),
          h("div", { class: "mini sutil", texto: num(l.participacao) + "%" }))))));
    return;
  }

  if (qual === "validade") {
    if (!d.linhas.length) {
      alvo.appendChild(vazio("certo", "Nada vencendo", "Nenhum lote vence nos próximos 60 dias."));
      return;
    }
    alvo.appendChild(h("div", { class: "lista" }, d.linhas.map((l) => {
      const venceu = l.dias_restantes < 0;
      return h("button", { class: "linha " + (venceu ? "critico" : "atencao"),
                           onclick: () => abrirItem(l.item_id) },
        h("div", { class: "linha-foto" }, icone("calendario", 20)),
        h("div", { class: "linha-corpo" },
          h("div", { class: "linha-nome uma-linha", texto: l.nome }),
          h("div", { class: "linha-meta" },
            h("span", { class: "mono", texto: l.lote || "sem lote" }),
            h("span", { class: "sep", texto: "·" }),

        h("div", { class: "linha-fim" },
          h("div", { class: "linha-saldo " + (venceu ? "critico" : "atencao") },
            num(l.quantidade), h("small", { texto: l.unidade })),
          h("span", { class: "mini sutil",
            texto: venceu ? `vencido há ${-l.dias_restantes}d` : `faltam ${l.dias_restantes}d` })));
    })));
    return;
  }

  if (qual === "parados") {
    if (!d.linhas.length) {
      alvo.appendChild(vazio("certo", "Nada parado", "Todo item com saldo se moveu nos últimos 90 dias."));
      return;
    }
    if (veDinheiro) {
      const total = d.linhas.reduce((s, l) => s + (l.valor_total || 0), 0);
      alvo.appendChild(h("div", { class: "indicador atencao", style: "margin-bottom:14px" },
        h("div", { class: "indicador-rotulo", texto: "Dinheiro dormindo na prateleira" }),
        h("div", { class: "indicador-valor", texto: dinheiro(total) }),
        h("div", { class: "indicador-nota", texto: `em ${plural(d.linhas.length, "item", "itens")}` })));
    }
    alvo.appendChild(h("div", { class: "lista" }, d.linhas.map((l) =>
      h("button", { class: "linha", onclick: () => abrirItem(l.id) },
        h("div", { class: "linha-foto" }, icone("relogio", 20)),
        h("div", { class: "linha-corpo" },
          h("div", { class: "linha-nome uma-linha", texto: l.nome }),
          h("div", { class: "linha-meta" },
            h("span", { texto: l.ultimo_movimento
              ? "último movimento " + quando(l.ultimo_movimento) : "nunca movimentado" }),
            l.localizacao ? h("span", { class: "sep", texto: "·" }) : null,
            l.localizacao ? h("span", { texto: l.localizacao }) : null)),
        h("div", { class: "linha-fim" },
          h("div", { class: "linha-saldo" }, num(l.saldo), h("small", { texto: l.unidade })),
          veDinheiro && l.valor_total
            ? h("div", { class: "mini sutil", texto: dinheiro(l.valor_total) }) : null)))));
  }
}

function formCadastro(g) {
  const campos = {};
  const corpo = h("div", { class: "pilha" });

  if (g.obra) {
    campos.obra_id = h("select", {},
      estado.cadastro.obras.map((o) => h("option", { value: o.id, texto: o.nome })));
    corpo.appendChild(h("div", { class: "campo" }, h("label", { texto: "Obra" }), campos.obra_id));
  }
  const rotulos = { codigo: "Código", nome: "Nome", endereco: "Endereço",
                    responsavel: "Responsável", contato: "Contato", telefone: "Telefone" };
  for (const c of g.campos) {
    campos[c] = h("input", { autocomplete: "off" });
    corpo.appendChild(h("div", { class: "campo" },
      h("label", { texto: rotulos[c] || c }), campos[c]));
  }

  abrir({
    titulo: "Novo em " + g.rotulo,
    corpo,
    pe: [
      h("button", { class: "btn fantasma", texto: "Cancelar", onclick: () => solta() }),
      h("button", { class: "btn primario", texto: "Salvar", onclick: async (ev) => {
        const dados = {};
        for (const [k, el] of Object.entries(campos)) {
          const v = el.value.trim();
          if (v) dados[k] = k === "obra_id" ? Number(v) : v;
        }
        if (!dados.nome) return recado("o nome é obrigatório", "erro");
        ev.currentTarget.disabled = true;
        try {
          await api("/cadastro/" + g.chave, { corpo: dados });
          solta(); recado("cadastrado", "ok"); irPara("cadastro");
        } catch (e) { ev.currentTarget.disabled = false; recado(e.message, "erro") }
      }}),
    ],
  });
}

          }
          solta(); recado("salvo", "ok"); irPara(estado.tela);
        } catch (e) { ev.currentTarget.disabled = false; recado(e.message, "erro") }
      }}),
    ],
  });
}

async function trocarPin() {
  const pin = await pedirNumero("Seu PIN de recebimento", "", "",
    "4 dígitos. É o que você digita quando recebe material — vale como assinatura.");
  if (pin === null) return;
  const texto = String(Math.round(pin)).padStart(4, "0");
  if (texto.length !== 4) return recado("o PIN tem 4 dígitos", "erro");
  try {
    await api(`/usuarios/${estado.eu.id}/pin`, { corpo: { pin: texto } });
    recado("PIN atualizado", "ok");
  } catch (e) { recado(e.message, "erro") }
}

/* ============================================================
   ETIQUETAS

   Papel comum e tesoura resolvem no primeiro dia. Exigir impressora
   térmica para começar é o tipo de barreira que faz o sistema não sair
   do papel. O QR guarda a URL do item, então a câmera de qualquer celular
   abre o sistema já no lugar certo.
   ============================================================ */

async function telaEtiquetas() {
  const alvo = limpar($("#conteudo"));
  $("#titulo-tela").textContent = "Etiquetas";
  const escolhidos = new Set();

  const campo = h("input", { type: "search", placeholder: "Filtrar itens…",
    oninput: () => { clearTimeout(t); t = setTimeout(carregar, 220) } });
  let t = null;
  const lista = h("div", { class: "lista" });
  const barra = h("div", { class: "acoes", style: "margin:12px 0" });

  function pintarBarra() {
    limpar(barra).append(
      h("button", { class: "btn primario toque", disabled: escolhidos.size ? null : true,
        onclick: () => imprimirEtiquetas([...escolhidos]) },
        icone("imprimir", 20), `Imprimir ${escolhidos.size || ""}`.trim()),
      h("button", { class: "btn toque", onclick: () => { escolhidos.clear(); carregar() } },
        "Limpar"));
  }

  async function carregar() {
    const p = new URLSearchParams({ limite: "60" });
    if (campo.value.trim()) p.set("q", campo.value.trim());
    const r = await api("/busca?" + p);
    limpar(lista);
    for (const i of r.itens) {
      const marcado = escolhidos.has(i.id);
      lista.appendChild(h("button", { class: "linha", onclick: (ev) => {
        escolhidos.has(i.id) ? escolhidos.delete(i.id) : escolhidos.add(i.id);
        carregar(); pintarBarra();
      }},
        h("div", { class: "linha-foto",
          style: marcado ? "background:var(--acento);color:var(--acento-txt)" : "" },
          icone(marcado ? "certo" : "etiqueta", 20)),
        h("div", { class: "linha-corpo" },
          h("div", { class: "linha-nome uma-linha", texto: i.nome }),
          h("div", { class: "linha-meta" },
            h("span", { class: "mono", texto: i.codigo }),
            i.localizacao ? h("span", { class: "sep", texto: "·" }) : null,
            i.localizacao ? h("span", { texto: i.localizacao }) : null))));
    }
    pintarBarra();
  }

  alvo.append(
    h("p", { class: "peq sutil", style: "margin-bottom:10px",
      texto: "Escolha os itens e imprima em folha A4 comum. Cada etiqueta traz o QR e o código escrito — se a câmera falhar, dá para digitar." }),
    h("div", { class: "busca-caixa" }, icone("busca", 20), campo),
    barra, lista);
  await carregar();
}

function imprimirEtiquetas(itens = [], ferramentas = []) {
  const p = new URLSearchParams();
  if (itens.length) p.set("itens", itens.join(","));
  if (ferramentas.length) p.set("ferramentas", ferramentas.join(","));
  // A folha abre em aba própria e imprime de lá: a página de impressão tem
  // margem zero e grade em milímetros, que não convivem com a tela do app.
  const janela = window.open("/api/etiquetas?" + p, "_blank");
  if (!janela) recado("libere as janelas para imprimir a etiqueta", "erro");
}

/* ============================================================
   TOUR — nosso, não de biblioteca

   Rearmar = subir TOUR_VERSAO. A versão faz parte da chave do "já vi";
   sem isso, passo novo nunca chega em quem já usava o sistema.

   A marca do "já vi" mora no localStorage COM o id da pessoa na chave:
   uma vez por pessoa, em cada aparelho. É de propósito nos dois sentidos —
   o tablet do almoxarifado é compartilhado e cada um que entra precisa
   aprender; e quem usa celular e computador aprende nos dois, onde a tela
   é diferente.
   ============================================================ */

const TOUR_VERSAO = 1;

const TRILHAS = {
  almoxarife: [
    { alvo: "#cx-busca-caixa", titulo: "Ache em três segundos",
      texto: "Uma caixa só: nome, código, prateleira, código de barras — ou o apelido que o pessoal usa na obra.",
      tela: "busca" },
    { alvo: "#bt-escanear", titulo: "Ou escaneie a etiqueta",
      texto: "Aponte a câmera para o QR. Não leu? O código vem escrito na etiqueta." },
    { alvo: "#ac-baixa", titulo: "Dar baixa é o que você mais faz",
      texto: "Item, quantidade, para qual frente. Três toques e o saldo já mudou.",
      tela: "inicio", mesmoSemAlvo: true },
    { alvo: "[data-tela=requisicoes]", titulo: "A fila de pedidos",
      texto: "O encarregado pede pelo celular. Você separa e entrega com o PIN de quem recebe — isso é a prova de entrega.",
      mesmoSemAlvo: true },
  ],
  encarregado: [
    { alvo: "#cx-busca-caixa", titulo: "Veja o que tem no almoxarifado",
      texto: "Antes de descer, confira o saldo aqui.", tela: "busca" },
    { alvo: "[data-tela=requisicoes]", titulo: "Peça sem sair da frente de serviço",
      texto: "Monte a lista pelo celular. O almoxarife já vê o pedido na hora.",
      mesmoSemAlvo: true },
  ],
  engenheiro: [
    { alvo: "#cx-criticos", titulo: "O que está faltando",
      texto: "Abaixo do mínimo aparece já na abertura, ordenado pelo mais crítico.",
      tela: "inicio", mesmoSemAlvo: true },
    { alvo: "[data-tela=relatorios]", titulo: "Consumo por frente",
      texto: "Quanto cada frente de serviço gastou, com valor. É o número que fecha a medição.",
      mesmoSemAlvo: true },
    { alvo: "[data-tela=inventario]", titulo: "Contagem e acuracidade",
      texto: "Conte a prateleira, compare com o sistema, e acompanhe o acerto subir mês a mês.",
      mesmoSemAlvo: true },
  ],
};
TRILHAS.admin = TRILHAS.engenheiro;

let tourPasso = 0, tourTrilha = null, tourElementos = [];

function chaveTour() {
  return `almox.tour.${estado.eu.id}.v${TOUR_VERSAO}`;
}

function talvezMostrarTour() {
  if (localStorage.getItem(chaveTour())) return;
  // A marca é conferida DE NOVO na hora de disparar, não só na de agendar:
  // no meio desses 700ms a pessoa pode ter aberto e dispensado o tour pelo
  // "?" do topo, e ele voltaria por cima do que ela já estava fazendo.
  setTimeout(() => {
    if (!estado.eu || localStorage.getItem(chaveTour())) return;
    comecarTour();
  }, 700);
}

async function comecarTour() {
  tourTrilha = TRILHAS[estado.eu.papel] || TRILHAS.encarregado;
  tourPasso = 0;
  await mostrarPasso();
}

async function mostrarPasso() {
  fecharTour(false);
  const passo = tourTrilha[tourPasso];
  if (!passo) return terminarTour();

  if (passo.tela && estado.tela !== passo.tela) {
    await irPara(passo.tela);
    await new Promise((r) => setTimeout(r, 180));
  }

  const alvo = passo.alvo ? document.querySelector(passo.alvo) : null;
  // Passo essencial aparece centralizado mesmo sem o alvo na tela. Sem
  // isso, quem entra com a fila vazia — o caso comum do primeiro dia —
  // nunca veria a explicação do que é a fila.
  if (!alvo && !passo.mesmoSemAlvo) { tourPasso++; return mostrarPasso() }

  const fundo = h("div", { class: "tour-fundo", onclick: () => terminarTour() });
  document.body.appendChild(fundo);
  tourElementos.push(fundo);

  let topoBalao = "50%", esquerdaBalao = "50%", transformar = "translate(-50%,-50%)";

  if (alvo) {
    const r = alvo.getBoundingClientRect();
    const realce = h("div", { class: "tour-alvo", style:
      `top:${r.top - 6}px;left:${r.left - 6}px;width:${r.width + 12}px;height:${r.height + 12}px` });
    document.body.appendChild(realce);
    tourElementos.push(realce);

    const abaixo = r.bottom + 190 < window.innerHeight;
    topoBalao = (abaixo ? r.bottom + 14 : r.top - 14) + "px";
    esquerdaBalao = Math.min(Math.max(r.left, 14), window.innerWidth - 14) + "px";
    transformar = abaixo ? "none" : "translateY(-100%)";
  }

  const balao = h("div", { class: "tour-balao",
    style: `top:${topoBalao};left:${esquerdaBalao};transform:${transformar}` },
    h("div", { class: "tour-passo", texto: `${tourPasso + 1} de ${tourTrilha.length}` }),
    h("h3", { texto: passo.titulo }),
    h("p", { texto: passo.texto }),
    h("div", { class: "acoes fim", style: "margin-top:12px" },
      h("button", { class: "btn plano", texto: "Pular", onclick: () => terminarTour() }),
      h("button", { class: "btn primario", texto: tourPasso === tourTrilha.length - 1 ? "Entendi" : "Próximo",
        onclick: () => { tourPasso++; mostrarPasso() } })));
  document.body.appendChild(balao);
  tourElementos.push(balao);
}

function fecharTour(tudo = true) {
  for (const e of tourElementos) e.remove();
  tourElementos = [];
}

function terminarTour() {
  fecharTour();
  if (estado.eu) localStorage.setItem(chaveTour(), "1");
}

/* ============================================================
   PARTIDA
   ============================================================ */

if (estado.token) comecar();
else telaLogin();
</script>
