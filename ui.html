function icone(nome, tamanho = 20) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("width", tamanho); s.setAttribute("height", tamanho);
  s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor");
  s.setAttribute("stroke-width", "2");
  s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", ICONES[nome] || ICONES.caixa);
  s.appendChild(p);
  return s;
}

/* ============================================================
   DOM — construtor mínimo.
   Tudo entra por textContent: nome de item vem do banco e pode ter
   `<` ou `&`. Montar tela com innerHTML é como se cola HTML de dado
   de cliente dentro da página sem querer.
   ============================================================ */
function h(tag, props = {}, ...filhos) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "texto") e.textContent = v;
    else if (k === "html") e.innerHTML = v;          // só com texto que EU montei
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "dados") Object.assign(e.dataset, v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const f of filhos.flat(9)) {
    if (f === null || f === undefined || f === false) continue;
    e.appendChild(f instanceof Node ? f : document.createTextNode(String(f)));
  }
  return e;
}
const $ = (s) => document.querySelector(s);
const limpar = (e) => { while (e.firstChild) e.removeChild(e.firstChild); return e };

/* ============================================================
   FORMATO
   ============================================================ */
const nf = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 2 });
const nfMoeda = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });

const num = (n) => nf.format(Number(n) || 0);
const dinheiro = (n) => nfMoeda.format(Number(n) || 0);

// "Texto de gente": nunca "item(ns)".
const plural = (n, um, muitos) => `${num(n)} ${Number(n) === 1 ? um : muitos}`;

function quando(iso) {
  if (!iso) return "—";
  const d = new Date(iso.endsWith("Z") ? iso : iso + "Z");
  const min = Math.round((Date.now() - d) / 60000);
  if (min < 1) return "agora";
  if (min < 60) return `há ${min} min`;
  if (min < 1440) return `há ${Math.round(min / 60)} h`;
  const dias = Math.round(min / 1440);
  if (dias < 7) return `há ${dias} ${dias === 1 ? "dia" : "dias"}`;
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" });
}
const dataHora = (iso) => iso
  ? new Date(iso.endsWith("Z") ? iso : iso + "Z")
      .toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "2-digit",
                                 hour: "2-digit", minute: "2-digit" })
  : "—";

/* Semáforo do estoque. Cor tem significado fixo em toda tela do sistema:
   vermelho abaixo do mínimo, âmbar chegando perto, verde folgado. */
function nivel(saldo, minimo) {
  // 0,001 e não 0: resíduo de ponto flutuante deixa saldos como 4,5e-13,
  // que a tela mostra como "0". Se a cor discordar do número lido, quem
  // está olhando conclui — com razão — que o sistema está errado.
  if (saldo < 0.001) return "critico";
  if (!minimo || minimo <= 0) return "";
  if (saldo <= minimo) return "critico";
  if (saldo <= minimo * 1.3) return "atencao";
  return "ok";
}

/* ============================================================
   ESTADO E API
   ============================================================ */
const estado = {
  token: localStorage.getItem("almox.token") || null,
  eu: null,
  cadastro: null,
  tela: "inicio",
  busca: { q: "", filtros: new Set(), categoria: null },
  recentes: JSON.parse(localStorage.getItem("almox.recentes") || "[]"),
};

async function api(rota, opcoes = {}) {
  const cab = { "content-type": "application/json" };
  if (estado.token) cab.authorization = "Bearer " + estado.token;
  if (opcoes.cru) delete cab["content-type"];

  const r = await fetch("/api" + rota, {
    method: opcoes.metodo || (opcoes.corpo ? "POST" : "GET"),
    headers: opcoes.cru ? { authorization: cab.authorization, "content-type": opcoes.tipo } : cab,
    body: opcoes.cru ? opcoes.cru : (opcoes.corpo ? JSON.stringify(opcoes.corpo) : undefined),
  });

  if (r.status === 204) return null;
  const tipo = r.headers.get("content-type") || "";
  const dados = tipo.includes("json") ? await r.json() : await r.text();

  if (!r.ok) {
    /* 401 quer dizer duas coisas. No login é senha errada; em qualquer outra
       rota é sessão vencida. Confundir manda a pessoa "entrar de novo" bem
       na hora em que ela está tentando entrar — e ela conclui que o sistema
       quebrou, não que errou a senha. */
    if (r.status === 401 && rota !== "/login") {
      estado.token = null;
      localStorage.removeItem("almox.token");
      telaLogin();
      throw new Error("sessão vencida");
    }
    const e = new Error(dados?.erro || "algo deu errado");
    e.status = r.status;
    throw e;
  }
  return dados;
}

/* ============================================================
   RECADO — nada de alert(): vem em inglês, é minúsculo e assusta
   ============================================================ */
let recadoAtual = null;
function recado(texto, tipo = "") {
  if (recadoAtual) recadoAtual.remove();
  const e = h("div", { class: "recado " + tipo, role: "status" },
    icone(tipo === "erro" ? "alerta" : tipo === "ok" ? "certo" : "ajuda", 18),
    h("span", { texto }));
  document.body.appendChild(e);
  recadoAtual = e;
  setTimeout(() => { if (recadoAtual === e) { e.remove(); recadoAtual = null } }, 3800);
}

/* ============================================================
   FOLHA (dialog)

   ⚠️ Folhas encadeadas não fecham entre si. `abrir()` TROCA o conteúdo do
   dialog que já está aberto. Fechar e reabrir faz o evento `close` da folha
   anterior chegar atrasado e cancelar a seguinte — o fluxo morre no meio,
   sem mensagem nenhuma. Quem responde clicando chama `solta()`; só o ✕, o
   fundo e o Esc fecham de verdade.
   ============================================================ */
let aoFechar = null;

function abrir({ titulo, corpo, pe, aoResponder }) {
  const dlg = $("#folha");
  aoFechar = aoResponder || null;

  const caixa = h("div", { class: "folha-caixa" },
    h("div", { class: "puxador" }),
    h("div", { class: "folha-cab" },
      h("h2", { texto: titulo || "" }),
      h("button", { class: "btn-icone", "aria-label": "Fechar", onclick: () => dlg.close() },
        icone("fechar", 20))),
    h("div", { class: "folha-corpo" }, corpo),
    pe ? h("div", { class: "folha-pe" }, pe) : null);

  limpar(dlg).appendChild(caixa);
  if (!dlg.open) dlg.showModal();
  const foco = caixa.querySelector("input,select,textarea,button.primario");
  if (foco && window.matchMedia("(min-width: 861px)").matches) foco.focus();
  return dlg;
}

/* Responde e fecha sem disparar o cancelamento. */
function solta(valor) {
  const fn = aoFechar;
  aoFechar = null;
  $("#folha").close();
  if (fn) fn(valor);
}

$("#folha").addEventListener("close", () => {
  const fn = aoFechar;
  aoFechar = null;
  if (fn) fn(null);
});
// Clicar no fundo fecha. O <dialog> ocupa a tela toda, então o alvo do
// clique é o próprio dialog só quando é fora da caixa.
$("#folha").addEventListener("click", (ev) => { if (ev.target.id === "folha") $("#folha").close() });

const perguntar = (titulo, texto, confirmar = "Confirmar", perigo = false) =>
  new Promise((ok) => abrir({
    titulo,
    corpo: h("p", { class: "fraco", texto }),
    aoResponder: (v) => ok(v === true),
    pe: [
      h("button", { class: "btn fantasma", texto: "Cancelar", onclick: () => solta(false) }),
      h("button", { class: "btn " + (perigo ? "perigo" : "primario"), texto: confirmar,
                    onclick: () => solta(true) }),
    ],
  }));

const escolher = (titulo, opcoes) =>
  new Promise((ok) => abrir({
    titulo,
    corpo: h("div", { class: "pilha apertada" },
      opcoes.map((o) => h("button", { class: "linha", onclick: () => solta(o.valor) },
        o.icone ? h("div", { class: "linha-foto" }, icone(o.icone, 22)) : null,
        h("div", { class: "linha-corpo" },
          h("div", { class: "linha-nome", texto: o.rotulo }),
          o.nota ? h("div", { class: "linha-meta" }, h("span", { texto: o.nota })) : null),
        icone("direita", 18)))),
    aoResponder: ok,
  }));

const pedirTexto = (titulo, rotulo, valorInicial = "", multilinha = false) =>
  new Promise((ok) => {
    const campo = h(multilinha ? "textarea" : "input", { value: valorInicial });
    if (!multilinha) campo.value = valorInicial;
    abrir({
      titulo,
      corpo: h("div", { class: "campo" }, h("label", { texto: rotulo }), campo),
      aoResponder: ok,
      pe: [
        h("button", { class: "btn fantasma", texto: "Cancelar", onclick: () => solta(null) }),
        h("button", { class: "btn primario", texto: "Salvar",
                      onclick: () => solta(campo.value.trim() || null) }),
      ],
    });
  });

/* Teclado numérico grande. Substitui o prompt() do navegador na hora de
   digitar quantidade — quem está com a peça na mão, de luva, não acerta um
   campo de 40px nem enxerga o diálogo minúsculo do sistema. */
const pedirNumero = (titulo, unidade = "", inicial = "", nota = "") =>
  new Promise((ok) => {
    let valor = String(inicial || "");
    const visor = h("div", { class: "visor" });
    const pintar = () => {
      limpar(visor);
      visor.appendChild(document.createTextNode(valor || "0"));
      if (unidade) visor.appendChild(h("small", { texto: unidade }));
    };
    const digitar = (d) => {
      if (d === "apagar") valor = valor.slice(0, -1);
      else if (d === ",") { if (!valor.includes(",")) valor = (valor || "0") + "," }
      else valor = (valor === "0" ? "" : valor) + d;
      pintar();
    };
    pintar();

    const teclas = ["1","2","3","4","5","6","7","8","9",",","0","apagar"];
    abrir({
      titulo,
      corpo: h("div", { class: "pilha" },
        nota ? h("div", { class: "aviso info" }, icone("ajuda", 16), h("span", { texto: nota })) : null,
        visor,
        h("div", { class: "teclado" },
          teclas.map((t) => h("button", {
            type: "button", onclick: () => digitar(t),
            "aria-label": t === "apagar" ? "Apagar" : t,
          }, t === "apagar" ? icone("esquerda", 22) : t)))),
      aoResponder: ok,
      pe: [
        h("button", { class: "btn fantasma", texto: "Cancelar", onclick: () => solta(null) }),
        h("button", { class: "btn primario", texto: "Confirmar", onclick: () => {
          const n = parseFloat(valor.replace(",", "."));
          if (!Number.isFinite(n) || n <= 0) return recado("digite uma quantidade", "erro");
          solta(n);
        }}),
      ],
    });
  });

/* ============================================================
   TEMA
   ============================================================ */
function trocarTema(forcado) {
  const atual = document.documentElement.dataset.tema;
  const novo = forcado || (atual === "escuro" ? "claro" : "escuro");
  document.documentElement.dataset.tema = novo;
  localStorage.setItem("almox.tema", novo);
  const bt = $("#bt-tema");
  if (bt) {
    limpar(bt).append(icone(novo === "escuro" ? "sol" : "lua", 18),
      h("span", { texto: novo === "escuro" ? "Tema claro" : "Tema escuro" }));
  }
}
trocarTema(localStorage.getItem("almox.tema") || "escuro");

/* A cor da empresa vem do cadastro e pinta identidade: topo, botão
   principal, aba ativa. NUNCA pinta o semáforo de estoque — semáforo que
   muda de cor por cliente não significa mais nada.
   O texto por cima é escolhido por luminância, senão marca clara fica
   ilegível em cima do próprio botão. */
function pintarAcento(cor) {
  if (!/^#[0-9a-f]{6}$/i.test(cor || "")) return;
  const r = parseInt(cor.slice(1, 3), 16),
        g = parseInt(cor.slice(3, 5), 16),
        b = parseInt(cor.slice(5, 7), 16);
  const raiz = document.documentElement.style;
  raiz.setProperty("--acento", cor);
  raiz.setProperty("--acento-rgb", `${r}, ${g}, ${b}`);
  const luz = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  raiz.setProperty("--acento-txt", luz > 0.6 ? "#1b1713" : "#ffffff");
}

<script>
"use strict";

/* ============================================================
   LOGIN
   ============================================================ */

function telaLogin() {
  $("#app").hidden = true;
  $("#tela-login").hidden = false;
  $("#login-erro").hidden = true;
  const s = $("#cx-senha"); if (s) s.value = "";
  mostrarAtalhosDemo();
}

/* A empresa `demo` é a obra de mentira, cheia, feita para mostrar o sistema.
   Os atalhos só aparecem nela — em empresa de cliente, some sozinho. */
async function mostrarAtalhosDemo() {
  const empresa = $("#cx-empresa").value.trim().toLowerCase();
  const caixa = $("#atalhos-demo");
  caixa.hidden = empresa !== "demo";
  if (caixa.hidden) return;

  const papeis = [
    { login: "almoxarife",  rotulo: "Almoxarife",  nota: "movimenta e entrega" },
    { login: "encarregado", rotulo: "Encarregado", nota: "pede material" },
    { login: "engenheiro",  rotulo: "Engenheiro",  nota: "gestão da obra" },
    { login: "diretoria",   rotulo: "Diretoria",   nota: "tudo, com valores" },
  ];
  limpar($("#lista-atalhos")).append(...papeis.map((p) =>
    h("button", { class: "chip", type: "button", title: p.nota, onclick: () => {
      $("#cx-login").value = p.login;
      $("#cx-senha").value = "demo";
      $("#form-login").requestSubmit();
    }}, p.rotulo)));
}
$("#cx-empresa").addEventListener("input", mostrarAtalhosDemo);

$("#form-login").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const bt = $("#bt-entrar");
  bt.disabled = true; bt.textContent = "Entrando…";
  try {
    const r = await api("/login", { corpo: {
      empresa: $("#cx-empresa").value.trim(),
      login: $("#cx-login").value.trim(),
      senha: $("#cx-senha").value,
    }});
    estado.token = r.token;
    estado.eu = r.eu;
    localStorage.setItem("almox.token", r.token);
    $("#login-erro").hidden = true;
    await comecar();
  } catch (e) {
    const cx = $("#login-erro");
    limpar(cx).append(icone("alerta", 16), h("span", { texto: e.message }));
    cx.hidden = false;
  } finally {
    bt.disabled = false; bt.textContent = "Entrar";
  }
});

async function sair() {
  try { await api("/sair", { metodo: "POST" }) } catch {}
  estado.token = null; estado.eu = null;
  localStorage.removeItem("almox.token");
  fecharTour();               // a sobra do tour ficaria por cima do login e travaria tudo
  telaLogin();
}

/* ============================================================
   NAVEGAÇÃO — cada papel abre num lugar diferente, porque cada um
   chega com uma pergunta diferente na cabeça.
   ============================================================ */

const TELAS = {
  inicio:      { rotulo: "Início",     icone: "inicio",     fn: () => telaInicio() },
  busca:       { rotulo: "Buscar",     icone: "busca",      fn: () => telaBusca() },
  requisicoes: { rotulo: "Requisições",icone: "lista",      fn: () => telaRequisicoes() },
  ferramentas: { rotulo: "Ferramentas",icone: "ferramenta", fn: () => telaFerramentas() },
  movimentos:  { rotulo: "Movimentos", icone: "historico",  fn: () => telaMovimentos() },
  inventario:  { rotulo: "Inventário", icone: "ajuste",     fn: () => telaInventario() },
  relatorios:  { rotulo: "Relatórios", icone: "grafico",    fn: () => telaRelatorios() },
  cadastro:    { rotulo: "Cadastro",   icone: "cadastro",   fn: () => telaCadastro() },
};

const MENU_POR_PAPEL = {
  almoxarife:  ["inicio", "busca", "requisicoes", "ferramentas", "inventario", "movimentos"],
  encarregado: ["inicio", "busca", "requisicoes", "ferramentas"],
  engenheiro:  ["inicio", "busca", "requisicoes", "ferramentas", "relatorios", "inventario", "movimentos", "cadastro"],
  admin:       ["inicio", "busca", "requisicoes", "ferramentas", "relatorios", "inventario", "movimentos", "cadastro"],
};

/* A barra de baixo tem no máximo cinco abas. A sexta faria cada alvo cair
   abaixo de 60px num celular de 390px — e este é o sistema onde o alvo de
   dedo é requisito, não preferência. O resto vai em "Mais". */
const MAX_ABAS = 5;

function montarNavegacao() {
  const chaves = MENU_POR_PAPEL[estado.eu.papel] || MENU_POR_PAPEL.encarregado;

  const lateral = limpar($("#nav-lateral"));
  for (const k of chaves) {
    const t = TELAS[k];
    lateral.appendChild(h("button", {
      class: "nav-item", dados: { tela: k }, onclick: () => irPara(k),
    }, icone(t.icone, 18), h("span", { texto: t.rotulo }),
       h("span", { class: "conta", dados: { conta: k }, hidden: true })));
  }

  const baixo = limpar($("#nav-baixo"));
  const visiveis = chaves.length > MAX_ABAS ? chaves.slice(0, MAX_ABAS - 1) : chaves;
  for (const k of visiveis) {
    const t = TELAS[k];
    baixo.appendChild(h("button", { dados: { tela: k }, onclick: () => irPara(k) },
      icone(t.icone, 21), h("span", { texto: t.rotulo }),
      h("span", { class: "conta", dados: { conta: k }, hidden: true })));
  }
  if (chaves.length > MAX_ABAS) {
    const resto = chaves.slice(MAX_ABAS - 1);
    baixo.appendChild(h("button", { onclick: () => menuMais(resto) },
      icone("lista", 21), h("span", { texto: "Mais" })));
  }
}

async function menuMais(chaves) {
  const escolha = await escolher("Mais", chaves.map((k) => ({
    valor: k, rotulo: TELAS[k].rotulo, icone: TELAS[k].icone,
  })));
  if (escolha) irPara(escolha);
}

function marcarAba(tela) {
  for (const b of document.querySelectorAll("[data-tela]")) {
    b.setAttribute("aria-current", b.dataset.tela === tela ? "true" : "false");
  }
}

async function irPara(tela, ...args) {
  if (!TELAS[tela]) tela = "inicio";
  estado.tela = tela;
  marcarAba(tela);
  $("#titulo-tela").textContent = TELAS[tela].rotulo;
  const alvo = limpar($("#conteudo"));
  alvo.appendChild(esqueleto());
  try {
    await TELAS[tela].fn(...args);
  } catch (e) {
    limpar($("#conteudo")).appendChild(vazio("alerta", "Não deu para carregar", e.message));
  }
}

const esqueleto = () => h("div", { class: "pilha" },
  [0, 1, 2, 3].map(() => h("div", { class: "esqueleto", style: "height:66px" })));

const vazio = (ic, titulo, texto) => h("div", { class: "vazio" },
  icone(ic, 40), h("h3", { texto: titulo }), texto ? h("p", { texto }) : null);

/* ============================================================
   PARTIDA

   ⚠️ `comecar()` roda de novo a cada login na mesma aba, então a montagem
   da casca tem que ser idempotente. Nada de outerHTML em elemento com id:
   a primeira execução apaga o id e a segunda estoura.
   ============================================================ */
async function comecar() {
  try {
    if (!estado.eu) estado.eu = await api("/eu");

    $("#tela-login").hidden = true;
    $("#app").hidden = false;

    const emp = estado.eu.empresa;
    pintarAcento(emp.cor);
    const sigla = emp.logo || emp.nome.slice(0, 2).toUpperCase();
    $("#marca-selo").textContent = sigla;
    $("#login-selo").textContent = sigla;
    $("#marca-nome").textContent = emp.nome;
    $("#marca-sub").textContent = `${estado.eu.nome} · ${rotuloPapel(estado.eu.papel)}`;
    document.title = `Almoxarifado — ${emp.nome}`;

    montarNavegacao();
    trocarTema(document.documentElement.dataset.tema);
    limpar($("#bt-sair")).append(icone("sair", 18), h("span", { texto: "Sair" }));
    limpar($("#bt-ajuda")).append(icone("ajuda", 18), h("span", { texto: "Como usar" }));
    limpar($("#bt-escanear")).appendChild(icone("escanear", 22));
    // A sigla da empresa no topo do celular é marca E botão de conta.
    $("#bt-conta").textContent = sigla;

    estado.cadastro = await api("/cadastro");

    // Etiqueta escaneada com a câmera do próprio celular cai em /e/CODIGO.
    // A rota entrega esta mesma página, que resolve o código e abre o item.
    const daEtiqueta = location.pathname.match(/^\/e\/(.+)$/);
    if (daEtiqueta) {
      history.replaceState({}, "", "/");
      await irPara("busca");
      await resolverCodigo(decodeURIComponent(daEtiqueta[1]));
    } else {
      await irPara(estado.eu.papel === "encarregado" ? "inicio" : "inicio");
    }

    talvezMostrarTour();
  } catch (e) {
    /* Duas coisas diferentes que não podem cair no mesmo lugar: sessão
       caída volta ao login em silêncio; erro de tela precisa aparecer.
       Engolir as duas juntas vira "digito a senha e não acontece nada". */
    if (e.message === "sessão vencida" || e.status === 401) { telaLogin(); return }
    console.error(e);
    recado("erro ao montar a tela: " + e.message, "erro");
  }
}

const rotuloPapel = (p) => ({
  admin: "Diretoria", engenheiro: "Engenheiro", almoxarife: "Almoxarife", encarregado: "Encarregado",
}[p] || p);

$("#bt-sair").addEventListener("click", sair);
$("#bt-tema").addEventListener("click", () => trocarTema());
$("#bt-escanear").addEventListener("click", () => escanear());
$("#bt-conta").addEventListener("click", () => folhaConta());
$("#bt-ajuda").addEventListener("click", () => comecarTour());
$("#bt-ajuda-topo").addEventListener("click", () => comecarTour());

/* ============================================================
   CONTA — no celular, é a única porta para sair e trocar o tema

   A lateral do computador some por media query no celular, e com ela iam
   embora Sair, Tema e Como usar: no aparelho não havia como fazer nenhum
   dos três. O botão da marca, no canto do topo, abre esta folha.

   O PIN também mora aqui, e não só no Cadastro: quem mais precisa dele é
   o encarregado — é o que ele digita para receber material — e o
   encarregado não tem aba de Cadastro nenhuma.
   ============================================================ */

function folhaConta() {
  const eu = estado.eu;
  const emp = eu.empresa;
  const escuro = document.documentElement.dataset.tema !== "claro";

  const opcao = (ic, titulo, nota, aoClicar, perigo) =>
    h("button", { class: "linha", onclick: aoClicar },
      h("div", { class: "linha-foto",
        style: perigo ? "color:var(--critico-txt)" : "" }, icone(ic, 20)),
      h("div", { class: "linha-corpo" },
        h("div", { class: "linha-nome", texto: titulo,
          style: perigo ? "color:var(--critico-txt)" : "" }),
        nota ? h("div", { class: "linha-meta" }, h("span", { texto: nota })) : null),
      icone("direita", 18));

  abrir({
    titulo: "Sua conta",
    corpo: h("div", { class: "pilha" },
      h("div", { class: "cartao fila" },
        h("div", { class: "marca-selo" }, emp.logo || emp.nome.slice(0, 2).toUpperCase()),
        h("div", { class: "cresce", style: "min-width:0" },
          h("div", { class: "forte uma-linha", texto: eu.nome }),
          h("div", { class: "peq sutil uma-linha",
                     texto: `${rotuloPapel(eu.papel)} · ${emp.nome}` }))),

      /* Estas duas abrem OUTRA folha por cima: chamam direto, sem `solta()`.
         `abrir()` troca o conteúdo do dialog que já está aberto — fechar
         antes faria o evento `close` chegar atrasado e cancelar a folha
         seguinte, e o toque simplesmente não faria nada. */
      h("div", { class: "lista" },
        opcao("gente", "Meu PIN", "os 4 dígitos que confirmam o recebimento",
          () => trocarPin()),

        opcao(escuro ? "sol" : "lua",
          escuro ? "Tema claro" : "Tema escuro",
          escuro ? "para o escritório e a luz do dia" : "para o galpão de luz baixa",
          () => { trocarTema(); folhaConta() }),

        // Esta FECHA de verdade: o passo a passo precisa da tela à mostra.
        opcao("ajuda", "Como usar", "refaz o passo a passo da sua função",
          () => { solta(); comecarTour() }),

        opcao("sair", "Sair", `sessão de ${eu.login}`,
          async () => {
            const certeza = await perguntar("Sair do sistema",
              "Você vai precisar entrar de novo com sua senha.", "Sair", true);
            if (certeza) sair();
          }, true))),
  });
}

/* Atalhos de teclado — o engenheiro usa computador, e `/` para buscar é o
   detalhe que ele percebe. */
document.addEventListener("keydown", (ev) => {
  if ($("#app").hidden) return;
  const digitando = /input|textarea|select/i.test(ev.target.tagName);
  if (ev.key === "/" && !digitando) { ev.preventDefault(); irPara("busca") }
  if (ev.key === "Escape" && !$("#folha").open && estado.tela !== "inicio") irPara("inicio");
});

/* ============================================================
   TELA · INÍCIO
   ============================================================ */

async function telaInicio() {
  const d = await api("/inicio");
  const eu = estado.eu;
  const alvo = limpar($("#conteudo"));

  const cartaoNumero = (rotulo, valor, nota, cor, aoClicar, ic) =>
    h(aoClicar ? "button" : "div", {
      class: "indicador " + (cor || ""), onclick: aoClicar,
    }, h("div", { class: "indicador-rotulo" }, ic ? icone(ic, 14) : null, h("span", { texto: rotulo })),
       h("div", { class: "indicador-valor", texto: valor }),
       nota ? h("div", { class: "indicador-nota", texto: nota }) : null);

  const indicadores = [];

  indicadores.push(cartaoNumero(
    "Abaixo do mínimo", num(d.criticos.n || 0),
    plural(d.criticos.zerados || 0, "zerado", "zerados"),
    (d.criticos.n > 0 ? "critico" : "ok"),
    () => { estado.busca.filtros = new Set(["critico"]); irPara("busca") }, "alerta"));

  if (eu.papel !== "encarregado") {
    indicadores.push(cartaoNumero(
      "Requisições na fila", num(d.requisicoes.abertas || 0),
      d.requisicoes.urgentes
        ? plural(d.requisicoes.urgentes, "urgente", "urgentes")
        : "nenhuma urgente",
      (d.requisicoes.urgentes > 0 ? "atencao" : ""),
      () => irPara("requisicoes"), "lista"));
  }

  indicadores.push(cartaoNumero(
    "Ferramentas na rua", num(d.ferramentas.em_uso || 0),
    d.ferramentas.atrasadas ? `${d.ferramentas.atrasadas} fora há +7 dias` : "todas no prazo",
    (d.ferramentas.atrasadas > 0 ? "atencao" : ""),
    () => irPara("ferramentas"), "ferramenta"));

  if (eu.ve_dinheiro) {
    indicadores.push(cartaoNumero(
      "Valor em estoque", dinheiro(d.valor_imobilizado),
      "custo da última entrada", "destaque",
      () => abrirRelatorio("abc"), "grafico"));
  } else {
    indicadores.push(cartaoNumero(
      "Movimento de hoje",
      num((d.hoje.entradas || 0) + (d.hoje.saidas || 0)),
      `${num(d.hoje.entradas || 0)} entradas · ${num(d.hoje.saidas || 0)} saídas`,
      "", () => irPara("movimentos"), "historico"));
  }

  alvo.appendChild(h("div", { class: "grade c4", style: "margin-bottom:16px" }, indicadores));

  // Ações rápidas: o que a pessoa veio fazer, no tamanho do dedo.
  const acoes = [];
  if (eu.papel !== "encarregado") {
    acoes.push(h("button", { class: "btn primario toque cresce", id: "ac-baixa",
      onclick: () => fluxoMovimento("saida") }, icone("saida", 20), "Dar baixa"));
    acoes.push(h("button", { class: "btn toque cresce", onclick: () => fluxoMovimento("entrada") },
      icone("entrada", 20), "Entrada"));
  } else {
    acoes.push(h("button", { class: "btn primario toque cresce", onclick: () => novaRequisicao() },
      icone("mais", 20), "Pedir material"));
  }
  acoes.push(h("button", { class: "btn toque", onclick: () => escanear(), id: "ac-escanear" },
    icone("escanear", 20), h("span", { class: "so-computador" }, "Escanear")));
  alvo.appendChild(h("div", { class: "acoes", style: "margin-bottom:18px" }, acoes));

  if (d.vencendo > 0 && eu.papel !== "encarregado") {
    alvo.appendChild(h("button", { class: "aviso", style: "width:100%;margin-bottom:16px",
      onclick: () => abrirRelatorio("validade") },
      icone("calendario", 18),
      h("span", { texto: `${plural(d.vencendo, "lote vence", "lotes vencem")} nos próximos 30 dias` }),
      icone("direita", 16)));
  }

  if (d.lista_critica.length) {
    alvo.appendChild(h("div", { class: "cartao", id: "cx-criticos" },
      h("div", { class: "cartao-cab" },
        h("h2", { texto: "Precisa comprar" }),
        h("button", { class: "btn plano", onclick: () => abrirRelatorio("reposicao") },
          "Ver lista", icone("direita", 16))),
      h("div", { class: "lista" }, d.lista_critica.map((i) => linhaItem(i)))));
  } else {
    alvo.appendChild(h("div", { class: "cartao" },
      vazio("certo", "Nenhum item abaixo do mínimo", "O estoque está em dia.")));
  }
}

/* ============================================================
   TELA · BUSCA — a tela principal deste sistema

   Uma caixa só resolve: código, nome, sinônimo, prateleira, código de
   barras do fabricante e patrimônio de ferramenta. Quem procura material
   não deveria escolher "onde" procurar antes de procurar.
   ============================================================ */

let buscaAtraso = null;

async function telaBusca() {
  const alvo = limpar($("#conteudo"));

  const campo = h("input", {
    type: "search", id: "cx-busca", value: estado.busca.q, enterkeyhint: "search",
    autocomplete: "off", autocapitalize: "none", spellcheck: "false",
    placeholder: "Nome, código, prateleira, patrimônio…",
    oninput: () => { clearTimeout(buscaAtraso); buscaAtraso = setTimeout(rodarBusca, 220) },
    onkeydown: (ev) => { if (ev.key === "Enter") { ev.preventDefault(); clearTimeout(buscaAtraso); rodarBusca() } },
  });

  const caixa = h("div", { class: "busca-caixa", id: "cx-busca-caixa" },
    icone("busca", 20), campo,
    reconhecimentoDeVoz() ? h("button", {
      class: "btn-icone", title: "Buscar falando", "aria-label": "Buscar falando",
      onclick: () => buscarFalando(campo),
    }, icone("voz", 20)) : null,
    h("button", { class: "btn-icone", title: "Escanear etiqueta", "aria-label": "Escanear",
                  onclick: () => escanear() }, icone("escanear", 20)),
    h("kbd", { class: "atalho", texto: "/" }));

  const chips = h("div", { class: "chips", id: "cx-chips", style: "margin-top:12px" });
  const resultado = h("div", { id: "cx-resultado", style: "margin-top:4px" });

  alvo.append(caixa, chips, resultado);

  const facetas = await api("/busca/facetas");
  montarChips(chips, facetas);
  await rodarBusca();

  if (window.matchMedia("(min-width: 861px)").matches) campo.focus();
}

/* Os filtros são como o engenheiro pensa — "o que está zerado", "o que
   não anda" — e não como o banco está organizado. Cada um mostra quantos
   são ANTES de clicar: filtro que leva a lista vazia é uma viagem perdida. */
function montarChips(caixa, facetas) {
  limpar(caixa);
  const c = facetas.contagem || {};
  const definicoes = [
    { id: "critico",    rotulo: "Abaixo do mínimo", n: c.critico, cor: "critico" },
    { id: "zerado",     rotulo: "Zerado",           n: c.zerado,  cor: "critico" },
    { id: "ferramenta", rotulo: "Ferramentas",      n: c.ferramenta },
    { id: "consumo",    rotulo: "Consumo",          n: c.consumo },
    { id: "parado",     rotulo: "Parado 90 dias",   n: c.parado,  cor: "atencao" },
  ];

  for (const d of definicoes) {
    if (!d.n) continue;
    const ligado = estado.busca.filtros.has(d.id);
    caixa.appendChild(h("button", {
      class: "chip " + (d.cor || ""), "aria-pressed": String(ligado),
      onclick: (ev) => {
        estado.busca.filtros.has(d.id)
          ? estado.busca.filtros.delete(d.id)
          : estado.busca.filtros.add(d.id);
        ev.currentTarget.setAttribute("aria-pressed",
          String(estado.busca.filtros.has(d.id)));
        rodarBusca();
      },
    }, h("span", { texto: d.rotulo }), h("span", { class: "conta", texto: num(d.n) })));
  }

  if (facetas.categorias?.length) {
    for (const cat of facetas.categorias) {
      if (!cat.n) continue;
      const ligado = estado.busca.categoria === cat.id;
      caixa.appendChild(h("button", {
        class: "chip", "aria-pressed": String(ligado),
        onclick: (ev) => {
          estado.busca.categoria = estado.busca.categoria === cat.id ? null : cat.id;
          for (const b of caixa.querySelectorAll(".chip")) {
            if (b !== ev.currentTarget && b.dataset.cat) b.setAttribute("aria-pressed", "false");
          }
          ev.currentTarget.setAttribute("aria-pressed", String(estado.busca.categoria === cat.id));
          rodarBusca();
        },
        dados: { cat: cat.id },
      }, h("span", { texto: cat.nome }), h("span", { class: "conta", texto: num(cat.n) })));
    }
  }
}

async function rodarBusca() {
  const campo = $("#cx-busca");
  if (!campo) return;
  estado.busca.q = campo.value.trim();
  const caixa = $("#cx-resultado");
  if (!caixa) return;

  const p = new URLSearchParams();
  if (estado.busca.q) p.set("q", estado.busca.q);
  if (estado.busca.filtros.size) p.set("filtros", [...estado.busca.filtros].join(","));
  if (estado.busca.categoria) p.set("categoria", estado.busca.categoria);

  // Sem termo e sem filtro: mostra o que foi escaneado por último. No
  // galpão, o item de agora costuma ser o mesmo de dez minutos atrás.
  if (!p.toString() && estado.recentes.length) {
    limpar(caixa).append(
      h("div", { class: "busca-grupo-titulo", texto: "Vistos recentemente" }),
      h("div", { class: "lista" }, estado.recentes.slice(0, 8).map((r) =>
        h("button", { class: "linha", onclick: () => abrirItem(r.id) },
          h("div", { class: "linha-foto" }, icone("caixa", 20)),
          h("div", { class: "linha-corpo" },
            h("div", { class: "linha-nome", texto: r.nome }),
            h("div", { class: "linha-meta" }, h("span", { class: "mono", texto: r.codigo }))),
          icone("direita", 18)))));
    return;
  }

  const r = await api("/busca?" + p.toString());

  limpar(caixa);

  // Código exato ganha de relevância de texto: quem escaneou a etiqueta ou
  // digitou o código quer AQUELE item, não o mais parecido.
  if (r.exato && r.itens.length === 1) {
    abrirItem(r.itens[0].id);
    return;
  }

  if (!r.itens.length && !r.ferramentas.length) {
    caixa.appendChild(vazio("busca", "Nada encontrado",
      estado.busca.q
        ? `Nenhum item para "${estado.busca.q}". Tente o código da etiqueta, ou parte do nome.`
        : "Nenhum item com esses filtros."));
    if (estado.busca.q && ["admin", "engenheiro"].includes(estado.eu.papel)) {
      caixa.appendChild(h("div", { class: "centro" },
        h("button", { class: "btn primario", onclick: () => formItem(null, estado.busca.q) },
          icone("mais", 18), "Cadastrar este item")));
    }
    return;
  }

  if (r.itens.length) {
    caixa.append(
      h("div", { class: "busca-grupo-titulo",
                 texto: `Materiais · ${plural(r.itens.length, "resultado", "resultados")}` }),
      h("div", { class: "lista" }, r.itens.map((i) => linhaItem(i))));
  }

  if (r.ferramentas.length) {
    caixa.append(
      h("div", { class: "busca-grupo", style: "margin-top:18px" },
        h("div", { class: "busca-grupo-titulo", texto: "Ferramentas" }),
        h("div", { class: "lista" }, r.ferramentas.map((f) => linhaFerramenta(f)))));
  }

  if (r.itens.length >= 40) {
    caixa.appendChild(h("p", { class: "sutil peq centro", style: "margin-top:12px",
      texto: "Mostrando os 40 primeiros — refine a busca para ver o resto." }));
  }
}

/* A linha mais repetida do sistema inteiro. */
function linhaItem(i) {
  const n = nivel(i.saldo, i.estoque_minimo);
  /* Ordem por utilidade no galpão: ONDE está, depois QUAL é. A categoria
     entra por último e some no celular — ela já está nos chips de filtro,
     e é justamente ela que empurrava o código para uma segunda linha,
     deixando cada resultado 20px mais alto sem informar nada novo. */
  const meta = [];
  if (i.localizacao) meta.push(h("span", { texto: i.localizacao }));
  meta.push(h("span", { class: "mono", texto: i.codigo }));
  if (i.categoria) meta.push(h("span", { class: "so-computador", texto: i.categoria }));
  if (i.tipo === "ferramenta") meta.push(h("span", { class: "selo", texto: "ferramenta" }));

  // O separador some junto com o que ele separa, senão sobra um "·" solto
  // no fim da linha no celular.
  const comSeparador = [];
  meta.forEach((m, k) => {
    if (k) {
      const escondido = m.classList.contains("so-computador");
      comSeparador.push(h("span", { class: "sep" + (escondido ? " so-computador" : ""),
                                    texto: "·" }));
    }
    comSeparador.push(m);
  });

  const alvoMinimo = i.estoque_maximo || (i.estoque_minimo ? i.estoque_minimo * 2 : 0);
  const porcento = alvoMinimo ? Math.min((i.saldo / alvoMinimo) * 100, 100) : 0;

  return h("button", { class: "linha " + n, onclick: () => abrirItem(i.id) },
    h("div", { class: "linha-foto" },
      i.foto_chave
        ? h("img", { src: "/api/foto/" + encodeURIComponent(i.foto_chave), alt: "",
                     loading: "lazy", style: "width:100%;height:100%;object-fit:cover" })
        : icone(i.tipo === "ferramenta" ? "ferramenta" : "caixa", 20)),
    h("div", { class: "linha-corpo" },
      h("div", { class: "linha-nome uma-linha", texto: i.nome }),
      h("div", { class: "linha-meta" }, comSeparador),
      i.estoque_minimo > 0
        ? h("div", { class: "medidor " + n, style: "margin-top:6px;max-width:180px" },
            h("i", { style: `width:${Math.max(porcento, 2)}%` }))
        : null),
    h("div", { class: "linha-fim" },
      h("div", { class: "linha-saldo " + n },
        num(i.saldo), h("small", { texto: i.unidade })),
      i.estoque_minimo > 0
        ? h("div", { class: "mini sutil", texto: `mín ${num(i.estoque_minimo)}` })
        : null));
}

function linhaFerramenta(f) {
  const emUso = f.situacao === "em_uso";
  const dias = f.dias_fora ?? (f.posse_desde
    ? Math.floor((Date.now() - new Date(f.posse_desde + "Z")) / 864e5) : null);
  const atrasada = emUso && dias >= 7;

  return h("button", { class: "linha " + (atrasada ? "atencao" : ""),
                       onclick: () => abrirFerramenta(f.id) },
    h("div", { class: "linha-foto" }, icone("ferramenta", 20)),
    h("div", { class: "linha-corpo" },
      h("div", { class: "linha-nome uma-linha", texto: f.item || f.item_nome }),
      h("div", { class: "linha-meta" },
        h("span", { class: "mono", texto: f.patrimonio }),
        h("span", { class: "sep", texto: "·" }),
        h("span", { texto: emUso ? `com ${f.posse_pessoa}` : (f.deposito || "no depósito") }))),
    h("div", { class: "linha-fim" },
      h("span", { class: "selo " + (emUso ? (atrasada ? "atencao" : "") : "ok") },
        h("span", { class: "ponto" }),
        emUso ? "em uso" : f.situacao === "manutencao" ? "manutenção" : "disponível"),
      emUso && dias !== null
        ? h("div", { class: "mini sutil", texto: `há ${dias} ${dias === 1 ? "dia" : "dias"}` })
        : null));
}

/* ---------- busca falando ----------
   No galpão a mão está suja e às vezes de luva. Falar é o caminho mais
   curto. Só aparece onde o navegador realmente suporta. */
const reconhecimentoDeVoz = () =>
  window.SpeechRecognition || window.webkitSpeechRecognition;

function buscarFalando(campo) {
  const Motor = reconhecimentoDeVoz();
  if (!Motor) return recado("este navegador não escuta", "erro");
  const r = new Motor();
  r.lang = "pt-BR";
  r.interimResults = false;
  r.maxAlternatives = 1;
  recado("pode falar…");
  r.onresult = (ev) => {
    campo.value = ev.results[0][0].transcript;
    rodarBusca();
  };
  r.onerror = (ev) => recado(
    ev.error === "not-allowed" ? "o microfone está bloqueado" : "não consegui ouvir", "erro");
  r.start();
}

<script>
"use strict";

/* ============================================================
   ITEM — ficha, saldo por depósito e kardex

function lembrarRecente(item) {
  const lista = estado.recentes.filter((r) => r.id !== item.id);
  lista.unshift({ id: item.id, nome: item.nome, codigo: item.codigo });
  estado.recentes = lista.slice(0, 12);
  localStorage.setItem("almox.recentes", JSON.stringify(estado.recentes));
}

async function abrirItem(id) {
  const d = await api(`/itens/${id}`);
  const i = d.item;
  lembrarRecente(i);

  const podeMover = ["admin", "engenheiro", "almoxarife"].includes(estado.eu.papel);
  const podeEditar = ["admin", "engenheiro"].includes(estado.eu.papel);
  const n = nivel(d.saldo, i.estoque_minimo);

  const corpo = h("div", { class: "pilha" });

  // Saldo grande, primeiro: é a pergunta que trouxe a pessoa até aqui.
  corpo.appendChild(h("div", { class: "cartao", style: "text-align:center" },
    h("div", { class: "indicador-valor " + n,

      num(d.saldo), h("small", { style: "font-size:1rem;color:var(--sutil);margin-left:6px",
                                 texto: i.unidade })),
    h("div", { class: "peq sutil" },
      i.estoque_minimo > 0 ? `mínimo ${num(i.estoque_minimo)} ${i.unidade}` : "sem mínimo definido"),

      ? h("div", { class: "mini sutil", style: "margin-top:4px",
                   texto: `equivale a ${num(d.saldo / i.fator_conversao)} ${i.unidade_compra}` })
      : null));

  const fatos = [];
  if (i.localizacao) fatos.push(["lugar", "Localização", i.localizacao]);
  if (i.categoria) fatos.push(["caixas", "Categoria", i.categoria]);
  if (i.fornecedor) fatos.push(["caminhao", "Fornecedor", i.fornecedor]);
  if (i.ean) fatos.push(["etiqueta", "Cód. de barras", i.ean]);
  if (i.unidade_compra) fatos.push(["caixa", "Compra em",

  if (estado.eu.ve_dinheiro && i.custo_ultimo) {
    fatos.push(["grafico", "Último custo", `${dinheiro(i.custo_ultimo)} / ${i.unidade}`]);

  if (fatos.length) {
    corpo.appendChild(h("div", { class: "cartao apertado" },

  // Saldo por depósito só aparece quando há mais de um: numa obra só, essa

  const comSaldo = d.saldos.filter((s) => s.quantidade !== 0);
  if (d.saldos.length > 1) {
    corpo.appendChild(h("div", { class: "cartao apertado" },
      h("div", { class: "rotulo-secao", style: "margin-bottom:8px", texto: "Onde está" }),
      h("div", { class: "pilha apertada" },
        (comSaldo.length ? comSaldo : d.saldos).map((s) =>
          h("div", { class: "fila" },
            h("span", { class: "peq cresce uma-linha",
                        texto: s.obra ? `${s.obra} · ${s.deposito}` : s.deposito }),
            h("span", { class: "peq forte num", texto: `${num(s.quantidade)} ${i.unidade}` }))))));
  }

  if (d.lotes.length) {
    corpo.appendChild(h("div", { class: "cartao apertado" },
      h("div", { class: "rotulo-secao", style: "margin-bottom:8px", texto: "Lotes" }),
      h("div", { class: "pilha apertada" }, d.lotes.map((l) => {
        const dias = l.validade
          ? Math.round((new Date(l.validade) - Date.now()) / 864e5) : null;
        return h("div", { class: "fila" },
          h("span", { class: "peq mono cresce", texto: l.codigo || `lote ${l.id}` }),
          l.validade
            ? h("span", { class: "selo " + (dias < 0 ? "critico" : dias < 30 ? "atencao" : ""),
                          texto: dias < 0 ? "vencido" : `vence em ${dias}d` })
            : null,
          h("span", { class: "peq forte num", texto: num(l.quantidade) }));
      }))));
  }

  if (d.ativos.length) {
    corpo.appendChild(h("div", { class: "cartao apertado" },
      h("div", { class: "rotulo-secao", style: "margin-bottom:8px",
                 texto: `Unidades (${d.ativos.length})` }),
      h("div", { class: "lista" }, d.ativos.map((a) => linhaFerramenta({ ...a, item: i.nome })))));
  }

  // Kardex: cada linha diz como o saldo FICOU. É o que o auditor procura.
  if (d.kardex.length) {

  abrir({

      h("div", { class: "fila", style: "margin-bottom:12px" },
        h("span", { class: "selo mono", texto: i.codigo }),
        i.tipo === "ferramenta" ? h("span", { class: "selo", texto: "ferramenta" }) : null,
        h("div", { class: "cresce" }),

function linhaKardex(m, unidade) {
  const entra = m.quantidade > 0;
  const classe = m.tipo === "ajuste" ? "ajuste" : entra ? "entrada" : "saida";
  const detalhe = [m.pessoa, m.frente, m.deposito, m.documento].filter(Boolean).join(" · ");

  return h("div", { class: "kardex-linha " + classe },
    h("div", { class: "kardex-bola" },
      icone(m.tipo === "ajuste" ? "ajuste" : entra ? "entrada" : "saida", 16)),
    h("div", { class: "kardex-corpo" },
      h("div", { class: "fila" },
        h("span", { class: "kardex-qtd " + (entra ? "mais" : "menos") },
          `${entra ? "+" : ""}${num(m.quantidade)} ${unidade || ""}`),
        h("div", { class: "cresce" }),
        h("span", { class: "kardex-quando", texto: quando(m.criado_em) })),
      h("div", { class: "kardex-saldo" },
        `${rotuloTipo(m.tipo)}${detalhe ? " · " + detalhe : ""}` +
        (m.saldo_apos !== undefined ? ` · ficou ${num(m.saldo_apos)}` : "")),
      m.motivo ? h("div", { class: "mini sutil", texto: m.motivo }) : null));
}

const rotuloTipo = (t) => ({
  entrada: "Entrada", saida: "Saída", devolucao: "Devolução", ajuste: "Ajuste",

/* ============================================================
   MOVIMENTO — o fluxo mais usado do sistema

   Três toques: qual item · quanto · confirma. Cada passo a mais aqui é um
   passo que o almoxarife vai pular anotando num caderno.
   ============================================================ */

async function fluxoMovimento(tipo, item) {
  if (!item) {
    const escolhido = await escolherItem(
      tipo === "entrada" ? "Entrada de qual material?" : "Baixa de qual material?");
    if (!escolhido) return;
    item = escolhido;
  }
  if (item.tipo === "ferramenta") {
    return recado("ferramenta se empresta e se devolve — abra a ficha dela", "erro");
  }

  const depositos = estado.cadastro.depositos;
  const frentes = estado.cadastro.frentes;

  const cxDeposito = h("select", {},
    depositos.map((d) => h("option", { value: d.id, texto: nomeDeposito(d) })));
  const cxFrente = h("select", {},
    h("option", { value: "", texto: "— sem frente —" }),
    frentes.map((f) => h("option", { value: f.id, texto: f.nome })));

  const cxDoc = h("input", { placeholder: "Nota fiscal / romaneio", autocomplete: "off" });
  const cxCusto = h("input", { type: "number", step: "0.01", placeholder: "0,00" });
  const cxMotivo = h("input", { placeholder: "Por que está ajustando" });
  const cxObs = h("input", { placeholder: "Observação (opcional)" });
  const cxValidade = h("input", { type: "date" });
  const cxLote = h("input", { placeholder: "Código do lote" });

  // Unidade de compra x de uso: quem recebe 10 sacos digita 10, não 500.
  // O sistema converte — misturar as duas é como o estoque desanda.
  let emUnidadeCompra = false;
  const temConversao = item.unidade_compra && item.fator_conversao > 1;
  const cxUnidade = temConversao ? h("div", { class: "segmentado" },
    h("button", { type: "button", "aria-pressed": "false", onclick: (ev) => {
      emUnidadeCompra = false; alternar(ev, false); atualizarVisor();
    }, texto: item.unidade }),
    h("button", { type: "button", "aria-pressed": "false", onclick: (ev) => {
      emUnidadeCompra = true; alternar(ev, true); atualizarVisor();
    }, texto: item.unidade_compra })) : null;

  function alternar(ev, compra) {
    for (const b of cxUnidade.children) b.setAttribute("aria-pressed", "false");
    ev.currentTarget.setAttribute("aria-pressed", "true");
  }
  if (cxUnidade) cxUnidade.children[0].setAttribute("aria-pressed", "true");

  let quantidade = null;
  const btQuantidade = h("button", { class: "btn grande largo", type: "button",
    style: "justify-content:space-between", onclick: async () => {
      const u = emUnidadeCompra ? item.unidade_compra : item.unidade;
      const n = await pedirNumero(`Quanto ${tipo === "entrada" ? "entrou" : "saiu"}?`, u,
        quantidade || "", temConversao && emUnidadeCompra
          ? `1 ${item.unidade_compra} = ${num(item.fator_conversao)} ${item.unidade}` : "");
      if (n !== null) { quantidade = n; atualizarVisor() }
    }});

  function atualizarVisor() {
    const u = emUnidadeCompra ? item.unidade_compra : item.unidade;
    limpar(btQuantidade).append(
      h("span", { class: "fraco", texto: "Quantidade" }),
      h("span", { class: "forte num",
                  texto: quantidade ? `${num(quantidade)} ${u}` : "toque para digitar" }));
  }
  atualizarVisor();

  const campos = h("div", { class: "pilha" },
    h("div", { class: "cartao apertado fila" },
      h("div", { class: "linha-foto" }, icone("caixa", 20)),
      h("div", { class: "cresce" },
        h("div", { class: "forte uma-linha", texto: item.nome }),
        h("div", { class: "mini sutil mono", texto: item.codigo }))),
    cxUnidade ? h("div", { class: "campo" },
      h("label", { texto: "Informar em" }), cxUnidade) : null,
    btQuantidade,
    h("div", { class: "campo" }, h("label", { texto: "Depósito" }), cxDeposito));

  if (tipo === "saida") {
    campos.append(
      h("div", { class: "campo" }, h("label", { texto: "Frente de serviço (centro de custo)" }), cxFrente),
      h("div", { class: "campo" }, h("label", { texto: "Quem está levando" }), cxPessoa));
  }
  if (tipo === "entrada") {
    campos.append(
      h("div", { class: "campo" }, h("label", { texto: "Documento" }), cxDoc),
      estado.eu.ve_dinheiro
        ? h("div", { class: "campo" },
            h("label", { texto: `Custo por ${item.unidade}` }), cxCusto)
        : null);
    if (item.controla_lote) {
      campos.append(
        h("div", { class: "campo" }, h("label", { texto: "Lote" }), cxLote),
        h("div", { class: "campo" }, h("label", { texto: "Validade" }), cxValidade));
    }
  }
  if (tipo === "ajuste") {
    campos.append(h("div", { class: "aviso" }, icone("alerta", 16),
      h("span", { texto: "Ajuste não apaga nada: entra no histórico como correção, com seu nome." })),

  campos.appendChild(h("div", { class: "campo" }, h("label", { texto: "Observação" }), cxObs));

  const titulos = { entrada: "Registrar entrada", saida: "Dar baixa", ajuste: "Ajustar saldo" };

  abrir({
    titulo: titulos[tipo],
    corpo: campos,
    pe: [
      h("button", { class: "btn fantasma", texto: "Cancelar", onclick: () => solta() }),
      h("button", { class: "btn primario", texto: "Confirmar", onclick: async (ev) => {
        if (!quantidade) return recado("informe a quantidade", "erro");
        if (tipo === "ajuste" && !cxMotivo.value.trim()) {
          return recado("o ajuste precisa de motivo", "erro");
        }
        ev.currentTarget.disabled = true;
        try {
          // No ajuste, o número digitado é a DIFERENÇA, e o sinal é escolhido
          // logo antes de gravar — quantidade sempre positiva no teclado.
          let q = quantidade;
          if (tipo === "ajuste") {
            const dir = await escolher("O saldo vai…", [
              { valor: 1,  rotulo: `Aumentar ${num(q)} ${item.unidade}`, icone: "entrada" },
              { valor: -1, rotulo: `Diminuir ${num(q)} ${item.unidade}`, icone: "saida" },
            ]);
            if (!dir) { ev.currentTarget.disabled = false; return }
            q = q * dir;
          }

          const r = await api("/movimentos", { corpo: {
            item_id: item.id, deposito_id: Number(cxDeposito.value), tipo, quantidade: q,
            em_unidade_compra: emUnidadeCompra,
            frente_id: cxFrente.value ? Number(cxFrente.value) : null,
            pessoa: cxPessoa.value.trim() || null,
            documento: cxDoc.value.trim() || null,

            motivo: cxMotivo.value.trim() || null,
            obs: cxObs.value.trim() || null,
            lote: cxLote.value.trim() || null,
            validade: cxValidade.value || null,
          }});
          solta();
          recado(`${titulos[tipo]} · saldo agora: ${num(r.saldo)} ${r.unidade}`, "ok");
          if (estado.tela === "inicio" || estado.tela === "busca") irPara(estado.tela);
        } catch (e) {
          ev.currentTarget.disabled = false;
          recado(e.message, "erro");
        }
      }}),

  });
}

const nomeDeposito = (d) => {
  const obra = estado.cadastro.obras.find((o) => o.id === d.obra_id);
  return obra ? `${obra.nome} · ${d.nome}` : d.nome;
};

/* Escolher item: busca ao vivo dentro da folha, com atalho para escanear.
   Devolve o item, ou null se a pessoa desistiu. */
function escolherItem(titulo, apenas = null) {
  return new Promise((ok) => {
    const lista = h("div", { class: "lista" });
    const campo = h("input", {
      type: "search", placeholder: "Nome, código ou prateleira…",
      autocomplete: "off", autocapitalize: "none",
      oninput: () => { clearTimeout(t); t = setTimeout(procurar, 200) },
    });
    let t = null;

    async function procurar() {
      const q = campo.value.trim();
      const p = new URLSearchParams({ limite: "20" });
      if (q) p.set("q", q);
      if (apenas) p.set("filtros", apenas);
      const r = await api("/busca?" + p);
      limpar(lista);
      if (!r.itens.length) {
        lista.appendChild(vazio("busca", "Nada encontrado", "Tente o código da etiqueta."));
        return;
      }
      for (const i of r.itens) {
        lista.appendChild(h("button", { class: "linha", onclick: () => solta(i) },
          h("div", { class: "linha-foto" }, icone("caixa", 20)),
          h("div", { class: "linha-corpo" },
            h("div", { class: "linha-nome uma-linha", texto: i.nome }),
            h("div", { class: "linha-meta" },
              h("span", { class: "mono", texto: i.codigo }),
              i.localizacao ? h("span", { class: "sep", texto: "·" }) : null,
              i.localizacao ? h("span", { texto: i.localizacao }) : null)),
          h("div", { class: "linha-fim" },
            h("div", { class: "linha-saldo " + nivel(i.saldo, i.estoque_minimo) },
              num(i.saldo), h("small", { texto: i.unidade })))));
      }
    }

    abrir({
      titulo,
      corpo: h("div", { class: "pilha" },
        h("div", { class: "busca-caixa" },
          icone("busca", 20), campo,
          h("button", { class: "btn-icone", "aria-label": "Escanear", onclick: async () => {
            const achado = await escanear(true);
            if (achado?.tipo === "item") {
              const d = await api(`/itens/${achado.id}`);
              solta(d.item);
            }
          }}, icone("escanear", 20))),
        lista),
      aoResponder: ok,
    });
    procurar();
    if (window.matchMedia("(min-width: 861px)").matches) setTimeout(() => campo.focus(), 60);
  });
}

/* ============================================================
   ESCANEAR

   Duas portas, porque nem todo navegador abre a mesma:
     · Android/Chrome tem BarcodeDetector nativo — lê QR e o código de
       barras do fabricante direto da câmera, sem biblioteca nenhuma.
     · iPhone não tem. Mas o QR da etiqueta guarda uma URL, então a câmera
       DO PRÓPRIO iOS lê a etiqueta e abre o sistema no item certo — que é
       até melhor que ler de dentro do app.
   E, nos dois casos, dá para digitar o código impresso na etiqueta. Câmera
   que não colabora nunca pode ser o fim do caminho.
   ============================================================ */

async function escanear(devolver = false) {
  const temDetector = "BarcodeDetector" in window;
  const corpo = h("div", { class: "pilha" });
  const cxCodigo = h("input", {
    placeholder: "Código da etiqueta", autocomplete: "off", autocapitalize: "characters",
    onkeydown: (ev) => { if (ev.key === "Enter") { ev.preventDefault(); confirmar() } },
  });

  let parar = null;
  const resultado = { valor: null };

  function confirmar() {
    const c = cxCodigo.value.trim();
    if (!c) return recado("digite o código", "erro");
    resultado.valor = c;
    if (parar) parar();
    solta(c);
  }

  if (temDetector) {
    const video = h("video", { playsinline: true, muted: true });
    corpo.appendChild(h("div", { class: "camera-caixa" }, video, h("div", { class: "camera-mira" })));

    (async () => {
      try {
        const fluxo = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
        });
        video.srcObject = fluxo;
        await video.play();
        const detector = new BarcodeDetector({
          formats: ["qr_code", "ean_13", "ean_8", "code_128", "code_39"],
        });
        let vivo = true;
        parar = () => { vivo = false; fluxo.getTracks().forEach((t) => t.stop()) };

        const laco = async () => {
          if (!vivo) return;
          try {
            const achados = await detector.detect(video);
            if (achados.length) {
              const codigo = achados[0].rawValue;
              if (navigator.vibrate) navigator.vibrate(60);
              parar();
              solta(codigo);
              return;
            }
          } catch {}
          requestAnimationFrame(laco);
        };
        requestAnimationFrame(laco);
      } catch (e) {
        limpar(corpo).appendChild(h("div", { class: "aviso" }, icone("alerta", 16),
          h("span", { texto: "Não consegui abrir a câmera. Digite o código da etiqueta." })));
        corpo.appendChild(h("div", { class: "campo" },
          h("label", { texto: "Código" }), cxCodigo));
      }
    })();
  } else {
    corpo.appendChild(h("div", { class: "aviso info" }, icone("ajuda", 18),
      h("span", { texto: "Este navegador não lê QR de dentro do app — mas a câmera do próprio celular lê a etiqueta e abre o sistema no item. Ou digite o código impresso." })));
  }

  corpo.appendChild(h("div", { class: "campo" },
    h("label", { texto: temDetector ? "Ou digite o código" : "Código da etiqueta" }), cxCodigo));

  const codigo = await new Promise((ok) => abrir({
    titulo: "Escanear etiqueta",
    corpo,
    aoResponder: (v) => { if (parar) parar(); ok(v) },
    pe: [
      h("button", { class: "btn fantasma", texto: "Cancelar", onclick: () => solta(null) }),
      h("button", { class: "btn primario", texto: "Buscar", onclick: confirmar }),
    ],
  }));

  if (!codigo) return null;
  return await resolverCodigo(codigo, devolver);
}

async function resolverCodigo(codigo, devolver = false) {
  try {
    const r = await api("/resolver?codigo=" + encodeURIComponent(codigo));
    if (devolver) return r;
    if (r.tipo === "item") await abrirItem(r.id);
    else if (r.tipo === "ferramenta") await abrirFerramenta(r.id);
    return r;
  } catch (e) {
    if (e.status === 404) {
      recado(`nada cadastrado com o código "${codigo}"`, "erro");
      if (["admin", "engenheiro"].includes(estado.eu.papel)) {
        const criar = await perguntar("Código desconhecido",
          `Não existe item com o código "${codigo}". Quer cadastrar agora?`, "Cadastrar");
        if (criar) formItem(null, "", codigo);
      }
    } else recado(e.message, "erro");
    return null;
  }
}

<script>

async function telaRequisicoes() {

      h("div", { class: "lista" }, fechadas.slice(0, 25).map((r) => linhaRequisicao(r))));

const SELO_REQ = {
  aberta:    { classe: "atencao", rotulo: "aberta" },
  separando: { classe: "acento",  rotulo: "separando" },
  entregue:  { classe: "ok",      rotulo: "entregue" },
  parcial:   { classe: "atencao", rotulo: "parcial" },
  cancelada: { classe: "",        rotulo: "cancelada" },
};

function linhaRequisicao(r) {
  const s = SELO_REQ[r.situacao] || SELO_REQ.aberta;
  return h("button", {
    class: "linha " + (r.urgencia === "urgente" && r.situacao === "aberta" ? "critico" : ""),
    onclick: () => abrirRequisicao(r.id),
  },
    h("div", { class: "linha-foto" }, icone("lista", 20)),
    h("div", { class: "linha-corpo" },
      h("div", { class: "linha-nome" },
        `#${r.numero} · ${r.frente || r.obra}`,
        r.urgencia === "urgente"
          ? h("span", { class: "selo critico", style: "margin-left:8px", texto: "urgente" })
          : null),
      h("div", { class: "linha-meta" },

        h("span", { class: "sep", texto: "·" }),
        h("span", { texto: plural(r.itens, "item", "itens") }),

        h("span", { texto: quando(r.criado_em) }))),

}

async function novaRequisicao() {
  const c = estado.cadastro;
  if (!c.obras.length) return recado("cadastre uma obra antes", "erro");

  const itens = [];
  const listaItens = h("div", { class: "pilha apertada" });

  const cxObra = h("select", {}, c.obras.map((o) => h("option", { value: o.id, texto: o.nome })));
  const cxFrente = h("select", {});
  const cxDeposito = h("select", {},
    c.depositos.map((d) => h("option", { value: d.id, texto: nomeDeposito(d) })));
  const cxObs = h("input", { placeholder: "Para quando, onde entregar…" });
  let urgente = false;

  function atualizarFrentes() {
    const obra = Number(cxObra.value);
    limpar(cxFrente).append(
      h("option", { value: "", texto: "— sem frente —" }),
      ...c.frentes.filter((f) => f.obra_id === obra)
        .map((f) => h("option", { value: f.id, texto: f.nome })));
  }
  cxObra.addEventListener("change", atualizarFrentes);
  atualizarFrentes();
  if (estado.eu.obra_id) cxObra.value = estado.eu.obra_id;

  function pintarItens() {
    limpar(listaItens);
    if (!itens.length) {
      listaItens.appendChild(h("p", { class: "sutil peq centro",
        texto: "Nenhum item ainda — toque em “Adicionar item”." }));
      return;
    }
    itens.forEach((it, k) => {
      listaItens.appendChild(h("div", { class: "linha" },
        h("div", { class: "linha-corpo" },
          h("div", { class: "linha-nome uma-linha", texto: it.nome }),
          h("div", { class: "linha-meta" }, h("span", { class: "mono", texto: it.codigo }))),
        h("span", { class: "forte num", texto: `${num(it.qtd_pedida)} ${it.unidade}` }),
        h("button", { class: "btn-icone", "aria-label": "Remover",
                      onclick: () => { itens.splice(k, 1); pintarItens() } }, icone("lixo", 18))));
    });
  }
  pintarItens();

  abrir({
    titulo: "Nova requisição",
    corpo: h("div", { class: "pilha" },
      h("div", { class: "grade c2 firme" },
        h("div", { class: "campo" }, h("label", { texto: "Obra" }), cxObra),
        h("div", { class: "campo" }, h("label", { texto: "Frente" }), cxFrente)),
      h("div", { class: "campo" }, h("label", { texto: "Retirar em" }), cxDeposito),
      h("div", { class: "campo" }, h("label", { texto: "Observação" }), cxObs),
      h("button", { class: "chip", type: "button", "aria-pressed": "false",
        onclick: (ev) => {
          urgente = !urgente;

        }}, icone("alerta", 14), "Urgente"),
      h("hr", { class: "separador" }),

          solta();

        } catch (e) { ev.currentTarget.disabled = false; recado(e.message, "erro") }
      }}),

  });
}

async function abrirRequisicao(id) {
  const d = await api(`/requisicoes/${id}`);
  const r = d.requisicao;
  const podeAtender = ["admin", "engenheiro", "almoxarife"].includes(estado.eu.papel);
  const emAberto = ["aberta", "separando"].includes(r.situacao);
  const s = SELO_REQ[r.situacao] || SELO_REQ.aberta;

  // Quantidade a entregar por item, começando pelo que foi pedido — mas
  // limitada ao que existe, senão o almoxarife confirma uma entrega que o
  // servidor vai recusar item por item.
  const entregas = new Map();
  for (const i of d.itens) {
    entregas.set(i.item_id, Math.min(i.qtd_pedida - i.qtd_atendida, Math.max(i.saldo, 0)));
  }

  const lista = h("div", { class: "pilha apertada" });
  function pintar() {
    limpar(lista);
    for (const i of d.itens) {
      const querido = i.qtd_pedida - i.qtd_atendida;
      const falta = i.saldo < querido;
      const vai = entregas.get(i.item_id);
      lista.appendChild(h("div", { class: "linha " + (falta ? "atencao" : "") },
        h("div", { class: "linha-corpo" },
          h("div", { class: "linha-nome uma-linha", texto: i.nome }),
          h("div", { class: "linha-meta" },
            h("span", { class: "mono", texto: i.codigo }),
            i.localizacao ? h("span", { class: "sep", texto: "·" }) : null,
            i.localizacao ? h("span", { texto: i.localizacao }) : null,
            h("span", { class: "sep", texto: "·" }),
            h("span", { class: falta ? "" : "", texto: `tem ${num(i.saldo)}` }))),
        h("div", { class: "linha-fim" },
          h("div", { class: "linha-saldo", texto: `${num(i.qtd_pedida)} ${i.unidade}` }),
          emAberto && podeAtender
            ? h("button", { class: "btn peq", style: "min-height:32px;padding:0 10px",
                onclick: async () => {
                  const n = await pedirNumero(`Entregar quanto de ${i.nome}?`, i.unidade, vai,
                    `pedido ${num(querido)} · em estoque ${num(i.saldo)}`);
                  if (n !== null) { entregas.set(i.item_id, n); pintar() }
                }}, `entregar ${num(vai)}`)
            : i.qtd_atendida > 0
              ? h("span", { class: "selo ok", texto: `entregue ${num(i.qtd_atendida)}` })
              : null)));
    }
  }
  pintar();

  const acoes = [];

      }}));
    }
    acoes.push(h("button", { class: "btn primario", texto: "Entregar",
      onclick: () => confirmarEntrega(id, d, entregas) }));
  } else if (emAberto) {
    acoes.push(h("button", { class: "btn fantasma", texto: "Cancelar pedido",
      onclick: async () => {
        const motivo = await pedirTexto("Cancelar pedido", "Por quê?");
        if (motivo === null) return;
        await api(`/requisicoes/${id}/cancelar`, { corpo: { motivo } });
        solta(); irPara("requisicoes");
      }}));
  }

  abrir({
    titulo: `Requisição #${r.numero}`,
    corpo: h("div", { class: "pilha" },
      h("div", { class: "fila" },
        h("span", { class: "selo " + s.classe, texto: s.rotulo }),
        r.urgencia === "urgente" ? h("span", { class: "selo critico", texto: "urgente" }) : null),
      h("div", { class: "cartao apertado pilha apertada" },
        linhaFato("gente", "Pediu", r.solicitante),
        linhaFato("lugar", "Obra", r.obra + (r.frente ? ` · ${r.frente}` : "")),
        linhaFato("caixas", "Retirar em", r.deposito),
        linhaFato("relogio", "Aberta", dataHora(r.criado_em)),
        r.recebido_por ? linhaFato("certo", "Recebido por", r.recebido_por) : null,
        r.entregue_em ? linhaFato("calendario", "Entregue", dataHora(r.entregue_em)) : null),
      r.observacao ? h("div", { class: "aviso info" }, icone("papel", 16),
        h("span", { texto: r.observacao })) : null,

const linhaFato = (ic, rotulo, valor) => h("div", { class: "fila" },
  icone(ic, 16), h("span", { class: "peq fraco cresce", texto: rotulo }),

/* A entrega só fecha com o PIN de quem recebeu. Sem prova de entrega,
   "eu nunca peguei esse material" não tem resposta — e essa discussão
   acontece em toda obra. */
function confirmarEntrega(id, d, entregas) {
  const linhas = [...entregas.entries()].filter(([, q]) => q > 0);
  if (!linhas.length) return recado("nenhuma quantidade para entregar", "erro");

      h("div", { class: "aviso info" }, icone("gente", 18),
        h("span", { texto: "Quem está recebendo digita o PIN. É a assinatura da entrega." })),
      visor,
      h("div", { class: "teclado" },
        ["1","2","3","4","5","6","7","8","9","","0","apagar"].map((t) =>

            if (t === "apagar") pin = pin.slice(0, -1);

    pe: [
      h("button", { class: "btn fantasma", texto: "Voltar", onclick: () => solta() }),
      h("button", { class: "btn primario", texto: "Confirmar", onclick: async (ev) => {
        if (pin.length !== 4) return recado("o PIN tem 4 dígitos", "erro");
        ev.currentTarget.disabled = true;

async function devolverFerramenta(id, manutencao) {
  const obs = manutencao ? await pedirTexto("Mandar para manutenção", "O que houve?") : null;

async function telaMovimentos(itemId) {
  const alvo = limpar($("#conteudo"));
  const hoje = new Date().toISOString().slice(0, 10);
  const mesPassado = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10);

  const cxDe = h("input", { type: "date", value: mesPassado });
  const cxAte = h("input", { type: "date", value: hoje });
  const cxTipo = h("select", {},
    h("option", { value: "", texto: "Todos os tipos" }),
    ["entrada", "saida", "ajuste", "devolucao", "perda"].map((t) =>
      h("option", { value: t, texto: rotuloTipo(t) })));
  const cxFrente = h("select", {},
    h("option", { value: "", texto: "Todas as frentes" }),
    estado.cadastro.frentes.map((f) => h("option", { value: f.id, texto: f.nome })));
  const cxPessoa = h("input", { placeholder: "Quem retirou" });

  const resultado = h("div");

  async function carregar() {
    limpar(resultado).appendChild(esqueleto());
    const p = new URLSearchParams();
    if (itemId) p.set("item", itemId);
    if (cxDe.value) p.set("de", cxDe.value);
    if (cxAte.value) p.set("ate", cxAte.value);
    if (cxTipo.value) p.set("tipo", cxTipo.value);
    if (cxFrente.value) p.set("frente", cxFrente.value);
    if (cxPessoa.value.trim()) p.set("pessoa", cxPessoa.value.trim());

    const d = await api("/movimentos?" + p);
    limpar(resultado);
    if (!d.movimentos.length) {
      resultado.appendChild(vazio("historico", "Nenhum movimento", "Tente ampliar o período."));
      return;
    }

    // Agrupado por dia: "o que saiu ontem" é a pergunta real.
    const porDia = new Map();
    for (const m of d.movimentos) {
      const dia = m.criado_em.slice(0, 10);
      if (!porDia.has(dia)) porDia.set(dia, []);
      porDia.get(dia).push(m);
    }

    for (const [dia, linhas] of porDia) {
      resultado.append(
        h("div", { class: "busca-grupo-titulo", style: "margin-top:14px",
          texto: new Date(dia + "T12:00:00Z").toLocaleDateString("pt-BR",
            { weekday: "long", day: "2-digit", month: "long" }) }),
        h("div", { class: "cartao apertado" },
          h("div", { class: "kardex" }, linhas.map((m) =>
            h("div", { class: "kardex-linha " + (m.quantidade > 0 ? "entrada" : "saida"),
                       style: "cursor:pointer", onclick: () => abrirItem(m.item_id) },
              h("div", { class: "kardex-bola" },
                icone(m.tipo === "ajuste" ? "ajuste" : m.quantidade > 0 ? "entrada" : "saida", 16)),
              h("div", { class: "kardex-corpo" },
                h("div", { class: "fila" },
                  h("span", { class: "forte uma-linha cresce", texto: m.item }),
                  h("span", { class: "kardex-qtd " + (m.quantidade > 0 ? "mais" : "menos"),
                    texto: `${m.quantidade > 0 ? "+" : ""}${num(m.quantidade)} ${m.unidade}` })),
                h("div", { class: "kardex-saldo",
                  texto: [rotuloTipo(m.tipo), m.pessoa, m.frente, m.deposito, m.registrou]
                    .filter(Boolean).join(" · ") })))))));
    }
  }

  for (const c of [cxDe, cxAte, cxTipo, cxFrente]) c.addEventListener("change", carregar);
  let t = null;
  cxPessoa.addEventListener("input", () => { clearTimeout(t); t = setTimeout(carregar, 300) });

  alvo.append(
    h("div", { class: "cartao apertado", style: "margin-bottom:14px" },
      h("div", { class: "grade c4" },
        h("div", { class: "campo" }, h("label", { texto: "De" }), cxDe),
        h("div", { class: "campo" }, h("label", { texto: "Até" }), cxAte),
        h("div", { class: "campo" }, h("label", { texto: "Tipo" }), cxTipo),
        h("div", { class: "campo" }, h("label", { texto: "Frente" }), cxFrente)),
      h("div", { class: "fila", style: "margin-top:10px" },
        h("div", { class: "campo cresce" }, cxPessoa),
        h("button", { class: "btn fantasma", onclick: () => baixarCsv("movimentos", cxDe.value) },
          icone("baixar", 18), h("span", { class: "so-computador" }, "Planilha")))),
    resultado);

  await carregar();
}

/* Não brigar com o Excel: quem tem medo de sistema novo se acalma sabendo
   que pode levar tudo embora numa planilha. */
async function baixarCsv(tipo, de) {
  const r = await fetch(`/api/exportar/${tipo}` + (de ? `?de=${de}` : ""), {
    headers: { authorization: "Bearer " + estado.token },
  });
  if (!r.ok) return recado("não consegui exportar", "erro");
  const url = URL.createObjectURL(await r.blob());
  const a = h("a", { href: url, download: `${tipo}-${new Date().toISOString().slice(0,10)}.csv` });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

<script>
"use strict";

/* ============================================================
   INVENTÁRIO — contagem física contra o sistema

   O número que sai daqui é a acuracidade do estoque: a porcentagem de
   itens em que o sistema acertou. É o indicador que a diretoria acompanha
   subir mês a mês — e o que prova que o controle está sendo usado.
   ============================================================ */

async function telaInventario() {
  const d = await api("/inventarios");
  const alvo = limpar($("#conteudo"));

  alvo.appendChild(h("div", { class: "acoes", style: "margin-bottom:14px" },

      icone("mais", 20), "Nova contagem")));

  if (!d.inventarios.length) {
    alvo.appendChild(vazio("ajuste", "Nenhuma contagem ainda",
      "A contagem compara o que está na prateleira com o que o sistema diz, e mede quanto o estoque acerta."));

  }

  alvo.appendChild(h("div", { class: "lista" }, d.inventarios.map((i) => {
    const aberto = i.situacao === "aberto";
    const pct = i.itens ? Math.round((i.contados / i.itens) * 100) : 0;
    return h("button", { class: "linha", onclick: () => abrirInventario(i.id) },
      h("div", { class: "linha-foto" }, icone("ajuste", 20)),
      h("div", { class: "linha-corpo" },
        h("div", { class: "linha-nome", texto: i.nome || `Contagem #${i.id}` }),
        h("div", { class: "linha-meta" },
          h("span", { texto: i.deposito }),

          h("span", { texto: `${i.contados}/${i.itens} contados` }),
          h("span", { class: "sep", texto: "·" }),
          h("span", { texto: quando(i.criado_em) })),

          h("i", { style: `width:${pct}%` })) : null),
      h("div", { class: "linha-fim" },
        h("span", { class: "selo " + (aberto ? "atencao" : "ok"),
                    texto: aberto ? "aberta" : "fechada" })));
  })));

async function novoInventario() {
  const cxDeposito = h("select", {},
    estado.cadastro.depositos.map((d) => h("option", { value: d.id, texto: nomeDeposito(d) })));
  const cxCategoria = h("select", {},

    estado.cadastro.categorias.map((c) => h("option", { value: c.id, texto: c.nome })));
  const cxNome = h("input", { placeholder: "Ex.: Contagem de agosto" });

  abrir({
    titulo: "Nova contagem",
    corpo: h("div", { class: "pilha" },
      h("div", { class: "aviso info" }, icone("ajuda", 18),
        h("span", { texto: "O saldo do sistema é congelado agora. Movimento que acontecer durante a contagem não vira divergência." })),
      h("div", { class: "campo" }, h("label", { texto: "Nome" }), cxNome),
      h("div", { class: "campo" }, h("label", { texto: "Depósito" }), cxDeposito),
      h("div", { class: "campo" },
        h("label", { texto: "Contar só uma categoria" }), cxCategoria,
        h("span", { class: "dica", texto: "Contagem por partes é mais fácil de terminar que a do galpão inteiro." }))),
    pe: [
      h("button", { class: "btn fantasma", texto: "Cancelar", onclick: () => solta() }),
      h("button", { class: "btn primario", texto: "Abrir contagem", onclick: async (ev) => {
        ev.currentTarget.disabled = true;
        try {
          const r = await api("/inventarios", { corpo: {
            deposito_id: Number(cxDeposito.value),

async function abrirInventario(id) {
  const d = await api(`/inventarios/${id}`);
  const aberto = d.inventario.situacao === "aberto";
  const alvo = limpar($("#conteudo"));
  $("#titulo-tela").textContent = d.inventario.nome || `Contagem #${id}`;

  alvo.appendChild(h("div", { class: "grade c4", style: "margin-bottom:14px" },
    h("div", { class: "indicador" },
      h("div", { class: "indicador-rotulo", texto: "Itens" }),
      h("div", { class: "indicador-valor", texto: num(d.resumo.total) })),
    h("div", { class: "indicador" },
      h("div", { class: "indicador-rotulo", texto: "Contados" }),
      h("div", { class: "indicador-valor", texto: num(d.resumo.contados) })),
    h("div", { class: "indicador " + (d.resumo.divergentes ? "atencao" : "ok") },
      h("div", { class: "indicador-rotulo", texto: "Divergências" }),
      h("div", { class: "indicador-valor", texto: num(d.resumo.divergentes) })),
    h("div", { class: "indicador " + (d.resumo.acuracidade >= 95 ? "ok" : "atencao") },
      h("div", { class: "indicador-rotulo", texto: "Acuracidade" }),
      h("div", { class: "indicador-valor",
                 texto: d.resumo.acuracidade === null ? "—" : d.resumo.acuracidade + "%" }),
      h("div", { class: "indicador-nota", texto: "sistema x prateleira" }))));

  if (aberto) {
    alvo.appendChild(h("div", { class: "acoes", style: "margin-bottom:14px" },
      h("button", { class: "btn toque", onclick: async () => {
        const achado = await escanear(true);
        if (achado?.tipo === "item") contarItem(id, d.itens.find((i) => i.item_id === achado.id));
      }}, icone("escanear", 20), "Escanear e contar"),
      h("button", { class: "btn primario toque", onclick: async () => {
        const ok = await perguntar("Fechar contagem",
          `Cada divergência vira um ajuste no histórico, com seu nome e a data. ` +
          `${d.resumo.total - d.resumo.contados} item(ns) não contado(s) ficam como estão.`,
          "Fechar e ajustar");
        if (!ok) return;
        const r = await api(`/inventarios/${id}/fechar`, { metodo: "POST" });
        recado(`contagem fechada · ${plural(r.ajustes, "ajuste lançado", "ajustes lançados")}`, "ok");
        irPara("inventario");
      }}, icone("certo", 20), "Fechar contagem")));
  }

  const lista = h("div", { class: "lista" });
  for (const i of d.itens) {
    const contado = i.contagem !== null;

    lista.appendChild(h("button", {
      class: "linha " + (contado ? (certo ? "" : "atencao") : ""),
      onclick: () => aberto ? contarItem(id, i) : abrirItem(i.item_id),
    },
      h("div", { class: "linha-foto" },
        icone(contado ? (certo ? "certo" : "alerta") : "caixa", 20)),
      h("div", { class: "linha-corpo" },
        h("div", { class: "linha-nome uma-linha", texto: i.nome }),

      h("div", { class: "linha-fim" },

        contado && !certo

  async function contarItem(invId, item) {
